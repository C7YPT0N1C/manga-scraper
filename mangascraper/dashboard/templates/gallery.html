{% extends "base.html" %}
{% block content %}
<h2>Gallery Viewer</h2>

<!-- Tab switcher -->
<div id="modeTabs">
	<button class="modeTab active" data-mode="local">Local Galleries</button>
	<button class="modeTab" data-mode="stream">Stream by ID</button>
</div>

<!-- ===== LOCAL MODE ===== -->
<div id="localPane" class="modePane">
	<div id="localNav">
		<span id="localBreadcrumb"><a href="#" id="crumbRoot">Creators</a></span>
	</div>
	
	<!-- Search and Filter Bar -->
	<div id="searchFilterBar">
		<input type="text" id="searchInput" placeholder="Search by name...">
		<div class="filter-group" id="filterGroup"></div>
	</div>
	
	<!-- Gallery Grid -->
	<div id="localList" class="gallery-grid"></div>
	
	<!-- Pagination Controls -->
	<div class="pagination-controls" id="paginationControls" style="display:none">
		<button id="prevPageBtn">← Previous</button>
		<span class="pagination-info"><span id="pageNum">1</span> of <span id="totalPages">1</span></span>
		<button id="nextPageBtn">Next →</button>
	</div>
</div>

<!-- ===== STREAM MODE ===== -->
<div id="streamPane" class="modePane" style="display:none">
	<div id="streamControls">
		<label for="streamIdInput">Gallery ID:</label>
		<input type="number" id="streamIdInput" min="1" placeholder="e.g. 123456">
		<button id="streamStartBtn">Open</button>
	</div>
	<p id="streamStatus">Enter a gallery ID and click Open.</p>
	<p id="streamPathInfo"></p>
</div>

<!-- ===== SHARED READER OVERLAY ===== -->
<div id="readerOverlay" style="display:none">
	<div id="readerHeader">
		<button id="readerClose">&#x2715; Close</button>
		<span id="readerTitle"></span>
		<span id="readerCounter"></span>
		<button id="streamDownloadBtn" type="button" style="display:none">Download This Gallery</button>
	</div>
	<div id="readerBody">
		<button id="prevBtn" class="navBtn">&#8592;</button>
		<div id="readerImgWrap">
			<img id="readerImg" src="" alt="manga page">
		</div>
		<button id="nextBtn" class="navBtn">&#8594;</button>
	</div>
</div>
{% endblock %}

{% block scripts %}
<script>
'use strict';

// ── State ──────────────────────────────────────────────────────────────────
let _activeStreamId = null;
let _readerFromStream = false;
let _currentCreator = null;
let _allCreators = [];
let _allGalleries = [];
let _currentItemType = null;  // 'creators' or 'galleries'
let _currentPage = 1;
const _itemsPerPage = 25;
let _searchTerm = '';
let _activeFilters = {};

const reader = {
	pages: [],
	index: 0,
	title: '',
	onClose: null
};

// ── Utility ────────────────────────────────────────────────────────────────
async function apiFetch(url) {
	const res = await fetch(url);
	if (!res.ok) throw new Error(`HTTP ${res.status}`);
	return res.json();
}

// ── Search & Filter ───────────────────────────────────────────────────────
function setupSearchAndFilters() {
	document.getElementById('searchInput').addEventListener('input', (e) => {
		_searchTerm = e.target.value.toLowerCase();
		_currentPage = 1;
		refreshDisplay();
	});
}

function getFilteredItems() {
	let items = _currentItemType === 'creators' ? _allCreators : _allGalleries;
	
	// Apply search filter
	if (_searchTerm) {
		items = items.filter(item => {
			const name = (typeof item === 'string' ? item : item.label || item.name || '').toLowerCase();
			return name.includes(_searchTerm);
		});
	}
	
	// Apply active filters
	if (_currentItemType === 'galleries') {
		items = items.filter(gallery => {
			// Filter by size if selected
			if (_activeFilters.size && gallery.page_count) {
				const pageCount = gallery.page_count;
				if (_activeFilters.size === 'small' && pageCount > 50) return false;
				if (_activeFilters.size === 'medium' && (pageCount <= 50 || pageCount > 200)) return false;
				if (_activeFilters.size === 'large' && pageCount <= 200) return false;
			}
			return true;
		});
	}
	
	return items;
}

function getPaginatedItems(items) {
	const filteredCount = items.length;
	const totalPages = Math.ceil(filteredCount / _itemsPerPage) || 1;
	const startIdx = (_currentPage - 1) * _itemsPerPage;
	const endIdx = startIdx + _itemsPerPage;
	const paginatedItems = items.slice(startIdx, endIdx);
	
	return { items: paginatedItems, totalPages, filteredCount };
}

function updatePaginationControls(totalPages) {
	const controls = document.getElementById('paginationControls');
	const pageNumEl = document.getElementById('pageNum');
	const totalPagesEl = document.getElementById('totalPages');
	
	if (totalPages <= 1) {
		controls.style.display = 'none';
	} else {
		controls.style.display = 'flex';
		pageNumEl.textContent = _currentPage;
		totalPagesEl.textContent = totalPages;
		document.getElementById('prevPageBtn').disabled = _currentPage === 1;
		document.getElementById('nextPageBtn').disabled = _currentPage === totalPages;
	}
}

// ── Filter Group Setup ────────────────────────────────────────────────────
function setupFiltersForGalleries() {
	const filterGroup = document.getElementById('filterGroup');
	filterGroup.innerHTML = '';
	
	// Size filter
	const sizeFilter = document.createElement('select');
	sizeFilter.innerHTML = `
		<option value="">All sizes</option>
		<option value="small">Small (&lt;50 pages)</option>
		<option value="medium">Medium (50-200 pages)</option>
		<option value="large">Large (&gt;200 pages)</option>
	`;
	sizeFilter.addEventListener('change', (e) => {
		_activeFilters.size = e.target.value;
		_currentPage = 1;
		refreshDisplay();
	});
	filterGroup.appendChild(sizeFilter);
}

function setupFiltersForCreators() {
	const filterGroup = document.getElementById('filterGroup');
	filterGroup.innerHTML = '';
	// No filters for creators for now
}

// ── Tab switching ──────────────────────────────────────────────────────────
document.querySelectorAll('.modeTab').forEach(btn => {
	btn.addEventListener('click', () => {
		document.querySelectorAll('.modeTab').forEach(b => b.classList.remove('active'));
		document.querySelectorAll('.modePane').forEach(p => p.style.display = 'none');
		btn.classList.add('active');
		const pane = document.getElementById(btn.dataset.mode + 'Pane');
		if (pane) pane.style.display = '';
	});
});

// ── Gallery grid builder ───────────────────────────────────────────────────
function createGalleryGrid(items, itemType, onClick) {
	const el = document.getElementById('localList');
	el.innerHTML = '';
	el.className = 'gallery-grid';
	
	if (!items.length) {
		el.textContent = 'Nothing here.';
		el.className = '';
		return;
	}
	
	items.forEach(item => {
		const square = document.createElement('div');
		square.className = 'gallery-square';
		
		const imageDiv = document.createElement('div');
		imageDiv.className = 'gallery-square-image';
		
		const label = typeof item === 'string' ? item : (item.label || item.name || 'Unknown');
		
		if (itemType === 'creator') {
			const coverUrl = `/api/gallery/cover/${encodeURIComponent(label)}`;
			imageDiv.style.backgroundImage = `url('${coverUrl}')`;
		} else if (itemType === 'gallery') {
			const creator = _currentCreator || '';
			const coverUrl = `/api/gallery/cover/${encodeURIComponent(creator)}/${encodeURIComponent(label)}`;
			imageDiv.style.backgroundImage = `url('${coverUrl}')`;
		}
		
		const titleDiv = document.createElement('div');
		titleDiv.className = 'gallery-square-title';
		titleDiv.textContent = label;
		
		square.appendChild(imageDiv);
		square.appendChild(titleDiv);
		
		square.addEventListener('click', () => onClick(item));
		el.appendChild(square);
	});
}

function setBreadcrumb(parts) {
	const el = document.getElementById('localBreadcrumb');
	el.innerHTML = '';
	parts.forEach((part, i) => {
		if (i > 0) { const sep = document.createTextNode(' / '); el.appendChild(sep); }
		const a = document.createElement('a');
		a.href = '#';
		a.textContent = part.label;
		if (part.onClick) a.addEventListener('click', e => { e.preventDefault(); part.onClick(); });
		el.appendChild(a);
	});
}

// ── Refresh display based on current state ─────────────────────────────────
function refreshDisplay() {
	const filteredItems = getFilteredItems();
	const { items, totalPages } = getPaginatedItems(filteredItems);
	
	if (_currentItemType === 'creators') {
		createGalleryGrid(items, 'creator', loadGalleries);
	} else if (_currentItemType === 'galleries') {
		createGalleryGrid(items, 'gallery', item => loadPages(_currentCreator, item));
	}
	
	updatePaginationControls(totalPages);
}

// ── Local gallery browser ──────────────────────────────────────────────────
async function loadCreators() {
	setBreadcrumb([{ label: 'Creators' }]);
	_currentCreator = null;
	_currentItemType = 'creators';
	_currentPage = 1;
	_searchTerm = '';
	_activeFilters = {};
	
	document.getElementById('searchInput').value = '';
	setupFiltersForCreators();
	
	createGalleryGrid([], 'creator', () => {}, 'Loading...');
	try {
		const data = await apiFetch('/api/gallery/list_creators');
		_allCreators = data.creators || [];
		refreshDisplay();
	} catch (err) {
		document.getElementById('localList').textContent = 'Error: ' + err.message;
		document.getElementById('localList').className = '';
	}
}

async function loadGalleries(creator) {
	_currentCreator = creator;
	_currentItemType = 'galleries';
	_currentPage = 1;
	_searchTerm = '';
	_activeFilters = {};
	
	setBreadcrumb([
		{ label: 'Creators', onClick: loadCreators },
		{ label: creator }
	]);
	
	document.getElementById('searchInput').value = '';
	setupFiltersForGalleries();
	
	createGalleryGrid([], 'gallery', () => {}, 'Loading...');
	try {
		const data = await apiFetch(`/api/gallery/list_galleries/${encodeURIComponent(creator)}`);
		// Enrich gallery data with page counts
		_allGalleries = (data.galleries || []).map(gal => {
			if (typeof gal === 'string') {
				return { label: gal, name: gal };
			}
			return gal;
		});
		refreshDisplay();
	} catch (err) {
		document.getElementById('localList').textContent = 'Error: ' + err.message;
		document.getElementById('localList').className = '';
	}
}

async function loadPages(creator, gallery) {
	const galleryName = typeof gallery === 'string' ? gallery : (gallery.label || gallery.name || '');
	
	setBreadcrumb([
		{ label: 'Creators', onClick: loadCreators },
		{ label: creator, onClick: () => loadGalleries(creator) },
		{ label: galleryName }
	]);
	try {
		const data = await apiFetch(`/api/gallery/list_pages/${encodeURIComponent(creator)}/${encodeURIComponent(galleryName)}`);
		const mode = data.mode || 'directory';
		const pages = (data.pages || []).map(
			f => `/api/gallery/view/${encodeURIComponent(creator)}/${encodeURIComponent(galleryName)}/${encodeURIComponent(f)}`
		);
		if (!pages.length) {
			document.getElementById('localList').textContent = 'Gallery is empty.';
			document.getElementById('localList').className = '';
			return;
		}
		const title = mode === 'archive' ? `${galleryName} (archive)` : galleryName;
		_readerFromStream = false;
		openReader(pages, title, () => {
			document.getElementById('localPane').style.display = '';
			loadGalleries(creator);
		});
	} catch (err) {
		document.getElementById('localList').textContent = 'Error: ' + err.message;
		document.getElementById('localList').className = '';
	}
}

// ── Pagination ────────────────────────────────────────────────────────────
document.getElementById('prevPageBtn').addEventListener('click', () => {
	if (_currentPage > 1) {
		_currentPage--;
		refreshDisplay();
	}
});

document.getElementById('nextPageBtn').addEventListener('click', () => {
	const filteredItems = getFilteredItems();
	const totalPages = Math.ceil(filteredItems.length / _itemsPerPage) || 1;
	if (_currentPage < totalPages) {
		_currentPage++;
		refreshDisplay();
	}
});

// ── Stream mode ────────────────────────────────────────────────────────────
document.getElementById('streamStartBtn').addEventListener('click', startStream);
document.getElementById('streamDownloadBtn').addEventListener('click', downloadStreamGallery);
document.getElementById('streamIdInput').addEventListener('keydown', e => {
	if (e.key === 'Enter') startStream();
});

async function startStream() {
	const input = document.getElementById('streamIdInput');
	const status = document.getElementById('streamStatus');
	const id = parseInt(input.value, 10);
	if (!id || id < 1) { status.textContent = 'Please enter a valid gallery ID.'; return; }

	status.textContent = `Fetching metadata for #${id}...`;
	try {
		const data = await apiFetch(`/api/gallery/stream/${id}`);
		if (data.error) { status.textContent = 'Error: ' + data.error; return; }
		_activeStreamId = id;
		_readerFromStream = true;
		status.textContent = `Loaded ${data.page_count} pages. Opening reader...`;
		document.getElementById('streamPathInfo').textContent =
			`Temporary files: ${data.temp_dir} (auto-cleaned after ${data.expires_in_seconds}s inactivity)`;
		openReader(data.page_urls, data.title || `Gallery #${id}`, closeStream);
	} catch (err) {
		status.textContent = 'Failed: ' + err.message;
	}
}

async function downloadStreamGallery() {
	const input = document.getElementById('streamIdInput');
	const status = document.getElementById('streamStatus');
	const id = parseInt(input.value, 10);
	if (!id || id < 1) {
		status.textContent = 'Please enter a valid gallery ID first.';
		return;
	}
	try {
		await fetch('/api/scraper/queue/add', {
			method: 'POST',
			headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify({ ids: [id] })
		});
		status.textContent = `Gallery #${id} added to queue.`;
	} catch (err) {
		status.textContent = `Could not queue gallery #${id}: ${err.message}`;
	}
}

async function closeStream() {
	if (_activeStreamId === null) return;
	try {
		await fetch(`/api/gallery/stream/${_activeStreamId}/close`, { method: 'POST' });
	} catch { /* best effort */ }
	_activeStreamId = null;
	document.getElementById('streamStatus').textContent = 'Session closed.';
}

// ── Shared reader ──────────────────────────────────────────────────────────
function openReader(pages, title, onClose) {
	reader.pages = pages;
	reader.index = 0;
	reader.title = title;
	reader.onClose = onClose;
	document.getElementById('readerTitle').textContent = title;
	document.getElementById('streamDownloadBtn').style.display = _readerFromStream ? '' : 'none';
	document.getElementById('localPane').style.display = 'none';
	document.getElementById('streamPane').style.display = 'none';
	document.getElementById('readerOverlay').style.display = '';
	showPage();
}

function showPage() {
	const img = document.getElementById('readerImg');
	const counter = document.getElementById('readerCounter');
	img.src = reader.pages[reader.index];
	counter.textContent = `${reader.index + 1} / ${reader.pages.length}`;
	document.getElementById('prevBtn').disabled = reader.index === 0;
	document.getElementById('nextBtn').disabled = reader.index === reader.pages.length - 1;
}

document.getElementById('prevBtn').addEventListener('click', () => {
	if (reader.index > 0) { reader.index--; showPage(); }
});
document.getElementById('nextBtn').addEventListener('click', () => {
	if (reader.index < reader.pages.length - 1) { reader.index++; showPage(); }
});
document.addEventListener('keydown', e => {
	if (document.getElementById('readerOverlay').style.display === 'none') return;
	if (e.key === 'ArrowLeft' && reader.index > 0) { reader.index--; showPage(); }
	if (e.key === 'ArrowRight' && reader.index < reader.pages.length - 1) { reader.index++; showPage(); }
	if (e.key === 'Escape') closeReader();
});

document.getElementById('readerClose').addEventListener('click', closeReader);
function closeReader() {
	document.getElementById('readerOverlay').style.display = 'none';
	document.getElementById('streamDownloadBtn').style.display = 'none';
	// Re-show the active mode pane
	const activeMode = document.querySelector('.modeTab.active').dataset.mode;
	document.getElementById(activeMode + 'Pane').style.display = '';
	if (reader.onClose) reader.onClose();
}

// ── Init ───────────────────────────────────────────────────────────────────
setupSearchAndFilters();
loadCreators();
</script>
{% endblock %}
