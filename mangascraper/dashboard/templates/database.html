{% extends "base.html" %}

{% block content %}
<h2>📦 Database Viewer</h2>

<div id="controls">
  <button id="refreshBtn">🔄 Refresh</button>
  <input type="text" id="searchBox" placeholder="Search by title or ID...">
</div>

<table id="galleryTable">
  <thead>
    <tr>
      <th>ID</th>
      <th>Status</th>
      <th>Started</th>
      <th>Completed</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<p id="statusMsg">Loading galleries...</p>
{% endblock %}

{% block scripts %}
<script>
async function loadGalleries() {
  const status = document.getElementById('statusMsg');
  const tbody = document.querySelector('#galleryTable tbody');
  const search = document.getElementById('searchBox').value.toLowerCase();

  status.textContent = 'Loading...';
  tbody.innerHTML = '';

  try {
    const res = await fetch('/api/db/list');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    const galleries = Array.isArray(data.galleries) ? data.galleries : [];

    const filtered = galleries.filter(g => {
      const id = String(g.id ?? '').toLowerCase();
      const state = String(g.status ?? '').toLowerCase();
      return id.includes(search) || state.includes(search);
    });

    filtered.forEach(g => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${g.id ?? '-'}</td>
        <td>${g.status || '-'}</td>
        <td>${g.started_at || '-'}</td>
        <td>${g.completed_at || '-'}</td>
      `;
      tbody.appendChild(tr);
    });

    status.textContent = `${filtered.length} galleries loaded.`;
  } catch (err) {
    status.textContent = '❌ Failed to load galleries: ' + err.message;
  }
}

document.getElementById('refreshBtn').addEventListener('click', loadGalleries);
document.getElementById('searchBox').addEventListener('input', loadGalleries);

loadGalleries();
</script>
{% endblock %}
