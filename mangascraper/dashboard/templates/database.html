{% extends "base.html" %}
{% block content %}
<h2>Database Viewer</h2>

<div id="controls">
  <button id="refreshBtn">Refresh</button>
  <select id="tableSelect" title="Choose which database table to view">
    <option value="">— loading tables... —</option>
  </select>
  <input type="text" id="searchBox" placeholder="Search any column...">
</div>

<p id="statusMsg">Select a table to begin.</p>

<div id="tableWrap" style="overflow-x:auto">
  <table id="dataTable">
    <thead><tr id="tableHead"></tr></thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>
{% endblock %}

{% block scripts %}
<script>
let _autoRefreshTimer = null;
let _currentTable = '';

async function loadTables() {
  const sel = document.getElementById('tableSelect');
  try {
    const res = await fetch('/api/db/tables');
    const data = await res.json();
    sel.innerHTML = '<option value="">— select a table —</option>';
    (data.tables || []).forEach(t => {
      const opt = document.createElement('option');
      opt.value = t;
      opt.textContent = t;
      if (t === 'Galleries') opt.selected = true;
      sel.appendChild(opt);
    });
    // Load Galleries by default
    _currentTable = sel.value;
    if (_currentTable) loadTable(_currentTable);
  } catch (err) {
    document.getElementById('statusMsg').textContent = 'Failed to load table list: ' + err.message;
  }
}

async function loadTable(tableName, search) {
  if (!tableName) return;
  _currentTable = tableName;
  const status = document.getElementById('statusMsg');
  const head = document.getElementById('tableHead');
  const body = document.getElementById('tableBody');
  const searchVal = search !== undefined ? search : document.getElementById('searchBox').value.trim();

  status.textContent = `Loading ${tableName}...`;
  head.innerHTML = '';
  body.innerHTML = '';

  try {
    const params = new URLSearchParams({ limit: 1000 });
    if (searchVal) params.set('search', searchVal);
    const res = await fetch(`/api/db/table/${encodeURIComponent(tableName)}?${params}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    if (data.error) { status.textContent = data.error; return; }

    // Header
    (data.columns || []).forEach(col => {
      const th = document.createElement('th');
      th.textContent = col;
      head.appendChild(th);
    });

    // Rows
    (data.rows || []).forEach(row => {
      const tr = document.createElement('tr');
      row.forEach(cell => {
        const td = document.createElement('td');
        td.textContent = cell === null ? '' : String(cell);
        // Truncate very long cells (e.g. JSON blobs)
        if (td.textContent.length > 120) {
          td.title = td.textContent;
          td.textContent = td.textContent.slice(0, 117) + '...';
        }
        tr.appendChild(td);
      });
      body.appendChild(tr);
    });

    status.textContent = `${data.rows.length} rows in ${tableName}${searchVal ? ' (filtered)' : ''}.`;
  } catch (err) {
    status.textContent = 'Error: ' + err.message;
  }
}

function startAutoRefresh() {
  if (_autoRefreshTimer) clearInterval(_autoRefreshTimer);
  _autoRefreshTimer = setInterval(() => {
    if (_currentTable) loadTable(_currentTable);
  }, 20000);
}

document.getElementById('refreshBtn').addEventListener('click', () => loadTable(_currentTable));
document.getElementById('tableSelect').addEventListener('change', e => {
  document.getElementById('searchBox').value = '';
  loadTable(e.target.value, '');
});
document.getElementById('searchBox').addEventListener('input', e => loadTable(_currentTable, e.target.value));

loadTables();
startAutoRefresh();
</script>
{% endblock %}
