<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title if title else "MangaScraper Dashboard" }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <h1><span class="logo-pill">MangaScraper</span> Dashboard</h1>
    <nav class="main-nav">
      <a href="/creators/">Home</a>
      <a href="/collections/">Collections</a>
      <a href="/scraper">Scraper</a>
      <a href="/diagnostics">Diagnostics</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <div id="dynamicBar" class="dynamic-bar" style="display:none">
    <div class="dynamic-bar-head">
      <div class="dynamic-bar-title">Live Run Telemetry</div>
      <button id="dynamicBarToggle" type="button" class="dynamic-bar-toggle" title="Collapse or expand telemetry">▾</button>
    </div>
    <div id="dynamicBarContent">Status unavailable.</div>
  </div>

  <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
  <script>
    window.__dynamicBarStatusOverride = '';
    window.__dynamicBarStatusOverrideUntil = 0;
    window.__dynamicBarCollapsed = false;

    function _loadDynamicBarCollapsedState() {
      try {
        return localStorage.getItem('mangascraper.dynamicBarCollapsed') === '1';
      } catch {
        return false;
      }
    }

    function _saveDynamicBarCollapsedState(value) {
      try {
        localStorage.setItem('mangascraper.dynamicBarCollapsed', value ? '1' : '0');
      } catch {
        // ignore storage errors
      }
    }

    function _applyDynamicBarCollapsedState() {
      const content = document.getElementById('dynamicBarContent');
      const toggle = document.getElementById('dynamicBarToggle');
      const bar = document.getElementById('dynamicBar');
      if (!content || !toggle || !bar) return;
      content.style.display = window.__dynamicBarCollapsed ? 'none' : '';
      bar.classList.toggle('dynamic-bar-collapsed', window.__dynamicBarCollapsed);
      toggle.textContent = window.__dynamicBarCollapsed ? '▸' : '◂';
      toggle.title = window.__dynamicBarCollapsed ? 'Expand telemetry' : 'Collapse telemetry';
    }

    function _formatHudDuration(seconds) {
      const total = Number(seconds || 0);
      if (!Number.isFinite(total) || total <= 0) return '0s';
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const secs = Math.floor(total % 60);
      if (hours > 0) return `${hours}h ${minutes}m ${secs}s`;
      if (minutes > 0) return `${minutes}m ${secs}s`;
      return `${secs}s`;
    }

    function _formatHudBytesPerSecond(bytesPerSecond) {
      const val = Number(bytesPerSecond || 0);
      if (!Number.isFinite(val) || val <= 0) return '0 B/s';
      const units = ['B/s', 'KB/s', 'MB/s', 'GB/s'];
      let size = val;
      let unitIndex = 0;
      while (size >= 1024 && unitIndex < units.length - 1) {
        size /= 1024;
        unitIndex += 1;
      }
      return `${size >= 10 || unitIndex === 0 ? size.toFixed(0) : size.toFixed(1)} ${units[unitIndex]}`;
    }

    function _asText(value, fallback = '-') {
      if (value === null || value === undefined || value === '') return fallback;
      return String(value);
    }

    window.setDynamicBarStatusOverride = function(statusText) {
      window.__dynamicBarStatusOverride = String(statusText || '').trim();
      window.__dynamicBarStatusOverrideUntil = 0;
    };

    // Backward-compatible helper used by page scripts; now writes into dynamic bar status area.
    window.setGlobalStatusBadge = function(text, options = {}) {
      const durationMs = Number(options.durationMs || 0);
      const value = String(text || '').trim();
      window.__dynamicBarStatusOverride = value;
      window.__dynamicBarStatusOverrideUntil = durationMs > 0 ? Date.now() + durationMs : 0;
    };

    window.clearGlobalStatusBadge = function() {
      window.__dynamicBarStatusOverride = '';
      window.__dynamicBarStatusOverrideUntil = 0;
    };

    document.getElementById('dynamicBarToggle').addEventListener('click', () => {
      window.__dynamicBarCollapsed = !window.__dynamicBarCollapsed;
      _saveDynamicBarCollapsedState(window.__dynamicBarCollapsed);
      _applyDynamicBarCollapsedState();
    });

    async function _updateDynamicBarGlobal() {
      const dock = document.getElementById('dynamicBar');
      const content = document.getElementById('dynamicBarContent');
      if (!dock || !content) return;

      try {
        const res = await fetch('/api/scraper/status');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const c = data.counts || {};
        const p = data.progress || {};
        if (window.__dynamicBarStatusOverrideUntil > 0 && Date.now() >= window.__dynamicBarStatusOverrideUntil) {
          window.__dynamicBarStatusOverride = '';
          window.__dynamicBarStatusOverrideUntil = 0;
        }
        const dynamicStatus = window.__dynamicBarStatusOverride || String(data.status || 'unknown').toUpperCase();
        const runTotal = Number(p.total_galleries ?? data.queue_total ?? 0);
        const completedCount = Number(c.completed ?? p.completed ?? 0);
        const failedCount = Number(c.failed ?? p.failed ?? 0);
        const skippedCount = Number(c.skipped ?? p.skipped ?? 0);
        const pagesTotal = Number(p.total_pages ?? 0);
        const pagesProcessed = Number(p.pages_processed ?? 0);
        const pagesPerSecond = Number(p.pages_per_second ?? 0);

        const parts = [
          `Status: ${dynamicStatus}`,
          `PID: ${_asText(data.pid, 'N/A')}`,
          `Queued Galleries: ${_asText(runTotal, 0)}`,
          `Completed: ${_asText(completedCount, 0)}/${_asText(runTotal, 0)}`,
          `Failed: ${_asText(failedCount, 0)}/${_asText(runTotal, 0)}`,
          `Skipped: ${_asText(skippedCount, 0)}/${_asText(runTotal, 0)}`,
        ];
        if (pagesTotal > 0) {
          parts.push(`Pages: ${_asText(pagesProcessed, 0)}/${_asText(pagesTotal, 0)} (${pagesPerSecond.toFixed(2)} Pages/s)`);
        }
        parts.push(`Speed: ${_formatHudBytesPerSecond(p.download_speed_bytes ?? 0)}`);
        parts.push(`Uptime: ${_formatHudDuration(data.uptime_seconds ?? 0)}`);
        if (pagesTotal > 0) {
          parts.push(`ETA: ${_formatHudDuration(p.eta_seconds ?? 0)}`);
        }
        const line = parts.join(' | ');
        content.textContent = line;
        dock.style.display = '';
      } catch (err) {
        content.textContent = 'Status unavailable.';
      }
    }

    window.__dynamicBarCollapsed = _loadDynamicBarCollapsedState();
    _applyDynamicBarCollapsedState();
    _updateDynamicBarGlobal();
    setInterval(_updateDynamicBarGlobal, 5000);
  </script>
  <script>
    // Helper to set gallery cover into the tile element.
    // Loads the image to detect orientation and inserts an <img> tag.
    function setGalleryCover(el, url) {
      if (!el) return;
      try {
        el.style.backgroundImage = '';
        el.innerHTML = '';
        const img = new Image();
        img.decoding = 'async';
        img.addEventListener('load', () => {
          const isLandscape = img.naturalWidth > img.naturalHeight;
          img.className = isLandscape ? 'cover-rotated' : 'cover-normal';
          img.alt = '';
          // Ensure we append after setting classes
          if (el.firstChild) el.removeChild(el.firstChild);
          el.appendChild(img);
        });
        img.addEventListener('error', () => {
          // fallback to background-image if image fails to load
          el.style.backgroundImage = `url('${url}')`;
        });
        img.src = url;
      } catch (e) {
        el.style.backgroundImage = `url('${url}')`;
      }
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
