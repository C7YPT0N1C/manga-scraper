{% extends "base.html" %}
{% block content %}
<h2>Collections</h2>
<div
  id="galleryViewerConfig"
  data-config='{{ (gallery_viewer_config or {}) | tojson }}'
  data-initial-collection-id='{{ initial_collection_id or "" }}'
  data-initial-gallery-id='{{ initial_gallery_id or "" }}'
  hidden
></div>

<div class="panel">
  <h3>Create Collection</h3>
  <div class="row-wrap">
    <input id="newCollectionName" type="text" placeholder="Collection name">
    <select id="newCollectionType">
      <option value="normal">Normal</option>
      <option value="smart">Smart</option>
    </select>
    <input id="newCollectionDescription" type="text" placeholder="Description (optional)">
    <button id="createCollectionBtn" type="button">Create</button>
  </div>
  <p id="createCollectionMsg"></p>
</div>

<div class="panel">
  <h3>Collections</h3>
  <div id="collectionList"></div>
</div>

<div class="panel" id="collectionEditor" style="display:none">
  <h3 id="editorTitle">Collection</h3>
  <div class="row-wrap">
    <input id="editCollectionName" type="text" placeholder="Collection name">
    <input id="editCollectionDescription" type="text" placeholder="Description">
    <select id="editCollectionSortMode">
      <option value="id_desc">ID (Highest first)</option>
      <option value="id_asc">ID (Lowest first)</option>
      <option value="title_asc">Title (A-Z)</option>
      <option value="title_desc">Title (Z-A)</option>
      <option value="manual">Manual</option>
    </select>
    <button id="saveCollectionBtn" type="button">Save</button>
    <button id="deleteCollectionBtn" type="button" class="danger">Delete</button>
  </div>

  <h4>Filters</h4>
  <div id="filterRows"></div>
  <div class="row-wrap">
    <button id="addFilterRowBtn" type="button">Add Filter</button>
    <button id="saveFiltersBtn" type="button">Save Filters</button>
  </div>

  <h4>Smart Rule</h4>
  <div class="row-wrap">
    <input id="smartExpression" type="text" placeholder="(F1 OR F2) AND NOT F3">
    <button id="saveRuleBtn" type="button">Save Rule</button>
    <button id="refreshRuleBtn" type="button">Refresh Smart Collection</button>
  </div>

  <h4>Manual Adds</h4>
  <div class="row-wrap">
    <input id="addCreatorInput" type="text" placeholder="Creator name (snapshot add)">
    <button id="addCreatorBtn" type="button">Add Creator Galleries</button>
  </div>
  <div class="row-wrap">
    <input id="addGalleryIdsInput" type="text" placeholder="Gallery IDs (comma separated)">
    <button id="addGalleryIdsBtn" type="button">Add Galleries</button>
  </div>

  <h4>Items</h4>
  <div id="collectionItems"></div>
  <div class="pagination-controls" id="collectionPaginationControls" style="display:none">
    <button id="collectionPrevPageBtn" type="button">← Previous</button>
    <span class="pagination-info">Page <span id="collectionPageNum">1</span> of <span id="collectionTotalPages">1</span></span>
    <div class="filter-field filter-inline-field">
      <label for="collectionItemsPerPageSelect">Items Per Page</label>
      <select id="collectionItemsPerPageSelect" class="filter-select"></select>
    </div>
    <button id="collectionNextPageBtn" type="button">Next →</button>
  </div>
  <p id="editorMsg"></p>
</div>

<div id="readerOverlay" style="display:none">
  <div id="readerHeader">
    <button id="readerClose">&#x2715; Close</button>
    <span id="readerTitle"></span>
    <span id="readerCounter"></span>
  </div>
  <div id="readerBody">
    <button id="prevBtn" class="navBtn">&#8592;</button>
    <div id="readerImgWrap">
      <img id="readerImg" src="" alt="manga page">
    </div>
    <button id="nextBtn" class="navBtn">&#8594;</button>
  </div>
</div>

<div id="galleryDetailModal" class="detail-modal-bg" style="display:none">
  <div id="galleryDetailPanel" class="detail-modal-panel">
    <div class="detail-modal-header">
      <strong id="galleryDetailTitle">Gallery</strong>
      <button id="galleryDetailClose" type="button">&#x2715; Close</button>
    </div>
    <div class="detail-modal-body">
      <div class="detail-modal-layout">
        <div class="detail-modal-side">
          <div id="galleryDetailCover" class="detail-modal-cover" role="img" aria-label="Gallery cover"></div>
          <div class="detail-modal-actions-inline">
            <button id="galleryDetailReadBtn" type="button">Read Gallery</button>
            <button id="galleryDetailFavBtn" type="button" class="fav-btn">☆ Favourite</button>
          </div>
        </div>
        <div class="detail-modal-main">
          <p><strong>ID:</strong> <span id="galleryDetailId">Unknown</span></p>
          <p><strong>Creators:</strong> <span id="galleryDetailCreators">Unknown</span></p>
          <p><strong>Tags:</strong> <span id="galleryDetailTags">None</span></p>
          <p><strong>Languages:</strong> <span id="galleryDetailLanguages">Unknown</span></p>
          <p><strong>Pages:</strong> <span id="galleryDetailPages">0</span></p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/pagination.js') }}"></script>
<script>
'use strict';

const VIEWER_CONFIG = JSON.parse(document.getElementById('galleryViewerConfig').dataset.config || '{}');
const INITIAL_COLLECTION_ID = Number(document.getElementById('galleryViewerConfig').dataset.initialCollectionId || 0);
const INITIAL_GALLERY_ID = Number(document.getElementById('galleryViewerConfig').dataset.initialGalleryId || 0);
const PAGE_SIZE_OPTIONS = VIEWER_CONFIG.galleryTilesPerPage || [14, 28, 42, 56, 70];

function normalisePageSize(value, fallback) {
  return Pagination.normalisePageSize(value, PAGE_SIZE_OPTIONS, fallback);
}

document.documentElement.style.setProperty('--gallery-tile-min-width', `${Number(VIEWER_CONFIG.tileMinWidthPx || 960)}px`);
document.documentElement.style.setProperty('--gallery-tile-aspect-ratio', String(VIEWER_CONFIG.tileAspectRatio || '2 / 3'));

let selectedCollectionId = null;
let _detailGallery = null;
let _allCollectionItems = [];
let _collectionPage = 1;
let _collectionItemsPerPage = normalisePageSize(VIEWER_CONFIG.collectionPageSize, PAGE_SIZE_OPTIONS[1]);

const reader = {
  pages: [],
  index: 0,
  title: '',
};

function _setCollectionsUrl() {
  window.history.pushState({}, '', '/collections/');
}

function _setCollectionUrl(collectionId) {
  const cid = Number(collectionId || 0);
  if (!cid) {
    _setCollectionsUrl();
    return;
  }
  window.history.pushState({}, '', `/collections/${cid}/`);
}

function _setCollectionGalleryUrl(collectionId, galleryId) {
  const cid = Number(collectionId || 0);
  const gid = Number(galleryId || 0);
  if (!cid) {
    _setCollectionsUrl();
    return;
  }
  if (!gid) {
    _setCollectionUrl(cid);
    return;
  }
  window.history.pushState({}, '', `/collections/${cid}/${gid}/`);
}

function parseCommaSeparatedIds(value) {
  return String(value || '')
    .split(',')
    .map(part => Number(part.trim()))
    .filter(n => Number.isFinite(n) && n > 0)
    .map(n => Math.trunc(n));
}

function normaliseList(values) {
  return Array.isArray(values) ? values.map(item => String(item || '').trim()).filter(Boolean) : [];
}

async function api(url, options = {}) {
  const response = await fetch(url, options);
  const payload = await response.json().catch(() => ({}));
  if (!response.ok) {
    const message = payload && payload.error ? payload.error : `HTTP ${response.status}`;
    const err = new Error(message);
    err.payload = payload;
    err.status = response.status;
    throw err;
  }
  return payload;
}

function showPage() {
  const img = document.getElementById('readerImg');
  const counter = document.getElementById('readerCounter');
  img.src = reader.pages[reader.index];
  counter.textContent = `${reader.index + 1} / ${reader.pages.length}`;
  document.getElementById('prevBtn').disabled = reader.index === 0;
  document.getElementById('nextBtn').disabled = reader.index === reader.pages.length - 1;
}

function openReader(pages, title) {
  reader.pages = pages;
  reader.index = 0;
  reader.title = title;
  document.getElementById('readerTitle').textContent = title;
  document.getElementById('readerOverlay').style.display = '';
  showPage();
}

function closeReader() {
  document.getElementById('readerOverlay').style.display = 'none';
}

function renderGalleryDetail(gallery) {
  const title = String(gallery.title || gallery.name || `Gallery ${gallery.gallery_id || ''}`).trim();
  const creators = normaliseList(gallery.creators);
  const tags = normaliseList(gallery.tags);
  const languages = normaliseList(gallery.languages);
  const pageCount = Number(gallery.page_count || 0);
  const galleryId = Number(gallery.gallery_id || 0);

  document.getElementById('galleryDetailTitle').textContent = title;
  document.getElementById('galleryDetailId').textContent = galleryId > 0 ? String(galleryId) : 'Unknown';
  document.getElementById('galleryDetailCreators').textContent = creators.length ? creators.join(', ') : 'Unknown';
  document.getElementById('galleryDetailTags').textContent = tags.length ? tags.join(', ') : 'None';
  document.getElementById('galleryDetailLanguages').textContent = languages.length ? languages.join(', ') : 'Unknown';
  document.getElementById('galleryDetailPages').textContent = String(pageCount);

  const coverEl = document.getElementById('galleryDetailCover');
  if (galleryId > 0) {
    setGalleryCover(coverEl, `/api/gallery/cover_by_id/${encodeURIComponent(galleryId)}`);
  } else {
    coverEl.style.backgroundImage = '';
    coverEl.innerHTML = '';
  }

  const favBtn = document.getElementById('galleryDetailFavBtn');
  favBtn.className = 'fav-btn' + (gallery.favourite ? ' fav-active' : '');
  favBtn.textContent = gallery.favourite ? '★ Unfavourite' : '☆ Favourite';

  // Add handler for Read Gallery button — navigate to reader page
  const readBtn = document.getElementById('galleryDetailReadBtn');
  readBtn.onclick = () => {
    const galleryId = Number(gallery.gallery_id || 0);
    const cid = Number(selectedCollectionId || 0);
    if (!galleryId || !cid) return;
    const url = `/reader/collections/${cid}/${galleryId}/`;
    window.location.href = url;
  };
}

async function toggleGalleryFavourite(galleryId, targetValue) {
  const title = String(_detailGallery?.title || `Gallery ${galleryId}`);
  const data = await api(`/api/gallery/favourite/gallery/${encodeURIComponent(galleryId)}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ favourite: targetValue }),
  });
  const isFav = Boolean(data.favourite);

  const cards = document.querySelectorAll('#collectionItems .remove-item-btn');
  cards.forEach(btn => {
    if (Number(btn.dataset.galleryId) !== Number(galleryId)) return;
    const card = btn.closest('.gallery-square');
    if (card) {
      card.dataset.favourite = isFav ? '1' : '0';
    }
  });

  document.getElementById('editorMsg').textContent = `${title} ${isFav ? 'favourited' : 'unfavourited'}.`;
  return isFav;
}

async function readGalleryById(galleryId, title) {
  const data = await api(`/api/gallery/list_pages_by_id/${encodeURIComponent(galleryId)}`);
  const root = String(data.root_path || '');
  const pages = (data.pages || []).map(name => {
    const base = `/api/gallery/view_by_id/${encodeURIComponent(galleryId)}/${encodeURIComponent(name)}`;
    return root ? `${base}?root=${encodeURIComponent(root)}` : base;
  });
  if (!pages.length) {
    throw new Error('Gallery is empty.');
  }
  openReader(pages, title);
}

async function openGalleryDetail(item) {
  const galleryId = Number(item.gallery_id || 0);
  _detailGallery = {
    gallery_id: galleryId,
    title: String(item.title || `Gallery ${galleryId}`),
    page_count: Number(item.page_count || 0),
    status: String(item.status || ''),
    favourite: Boolean(item.favourite),
    creators: normaliseList(item.creators),
    tags: normaliseList(item.tags),
    languages: normaliseList(item.languages),
  };

  renderGalleryDetail(_detailGallery);
  document.getElementById('galleryDetailModal').style.display = '';

  if (!galleryId) {
    return;
  }

  try {
    const data = await api(`/api/gallery/details_by_id/${encodeURIComponent(galleryId)}`);
    _detailGallery = {
      ..._detailGallery,
      ...data,
      gallery_id: Number(data.gallery_id || galleryId),
      title: String(data.title || _detailGallery.title || `Gallery ${galleryId}`),
      creators: normaliseList(data.creators || _detailGallery.creators),
      tags: normaliseList(data.tags || _detailGallery.tags),
      languages: normaliseList(data.languages || _detailGallery.languages),
      page_count: Number(data.page_count || _detailGallery.page_count || 0),
      favourite: Boolean(data.favourite),
    };
    renderGalleryDetail(_detailGallery);
  } catch (err) {
    document.getElementById('editorMsg').textContent = `Could not load gallery metadata: ${err.message}`;
  }
}

function closeGalleryDetail() {
  _detailGallery = null;
  document.getElementById('galleryDetailModal').style.display = 'none';
}

function filterRowHtml(index, row = {}) {
  const key = row.filter_key || `F${index + 1}`;
  const type = row.filter_type || 'tag';
  const value = row.filter_value || '';
  return `
    <div class="row-wrap filter-row" data-index="${index}">
      <input class="filter-key" type="text" value="${key}" placeholder="F1">
      <select class="filter-type">
        <option value="id" ${type === 'id' ? 'selected' : ''}>ID</option>
        <option value="language" ${type === 'language' ? 'selected' : ''}>Language</option>
        <option value="tag" ${type === 'tag' ? 'selected' : ''}>Tag</option>
        <option value="creator" ${type === 'creator' ? 'selected' : ''}>Creator</option>
        <option value="favourite" ${type === 'favourite' ? 'selected' : ''}>Favourite</option>
        <option value="status" ${type === 'status' ? 'selected' : ''}>Status</option>
        <option value="rating_min" ${type === 'rating_min' ? 'selected' : ''}>Rating Min</option>
        <option value="rating_max" ${type === 'rating_max' ? 'selected' : ''}>Rating Max</option>
        <option value="page_min" ${type === 'page_min' ? 'selected' : ''}>Page Min</option>
        <option value="page_max" ${type === 'page_max' ? 'selected' : ''}>Page Max</option>
      </select>
      <input class="filter-value" type="text" value="${value}" placeholder="Filter value">
      <button type="button" class="remove-filter-btn">Remove</button>
    </div>
  `;
}

function readFilterRows() {
  const rows = [];
  document.querySelectorAll('#filterRows .filter-row').forEach(row => {
    const filterKey = row.querySelector('.filter-key').value.trim().toUpperCase();
    const filterType = row.querySelector('.filter-type').value;
    const filterValue = row.querySelector('.filter-value').value.trim();
    if (filterKey && filterType && filterValue) {
      rows.push({ filter_key: filterKey, filter_type: filterType, filter_value: filterValue });
    }
  });
  return rows;
}

function refreshCollectionItemsPerPageSelect() {
  const select = document.getElementById('collectionItemsPerPageSelect');
  Pagination.populateItemsPerPageSelect(select, PAGE_SIZE_OPTIONS, _collectionItemsPerPage);
}

function getCollectionPaginatedItems(items) {
  const { items: paginatedItems, totalPages, filteredCount } = Pagination.getPaginatedSlice(items, _collectionPage, _collectionItemsPerPage);
  return { items: paginatedItems, totalPages, filteredCount };
}

function updateCollectionPaginationControls(totalPages, filteredCount) {
  const controls = document.getElementById('collectionPaginationControls');
  const pageNumEl = document.getElementById('collectionPageNum');
  const totalPagesEl = document.getElementById('collectionTotalPages');

  if (_collectionPage > totalPages) {
    _collectionPage = totalPages;
  }

  refreshCollectionItemsPerPageSelect();

  if (filteredCount <= 0) {
    controls.style.display = 'none';
  } else {
    controls.style.display = 'flex';
    pageNumEl.textContent = _collectionPage;
    totalPagesEl.textContent = totalPages;
    document.getElementById('collectionPrevPageBtn').disabled = _collectionPage === 1;
    document.getElementById('collectionNextPageBtn').disabled = _collectionPage === totalPages;
  }
}

function renderItems(items) {
  const host = document.getElementById('collectionItems');
  _allCollectionItems = Array.isArray(items) ? items : [];
  const { items: pageItems, totalPages, filteredCount } = getCollectionPaginatedItems(_allCollectionItems);

  if (!pageItems.length) {
    host.className = '';
    host.innerHTML = '<p>No items in this collection.</p>';
    updateCollectionPaginationControls(totalPages, filteredCount);
    return;
  }
  host.innerHTML = '';
  host.className = 'gallery-grid';

  pageItems.forEach(item => {
    const galleryId = Number(item.gallery_id || 0);
    const title = String(item.title || `Gallery ${galleryId}`).trim();
    const pageCount = Number(item.page_count || 0);
    const status = String(item.status || '').trim();
    const sourceFlags = [item.is_manual ? 'manual' : '', item.is_rule ? 'rule' : ''].filter(Boolean);

    const card = document.createElement('div');
    card.className = 'gallery-square';
    card.dataset.galleryId = String(galleryId);
    card.dataset.favourite = item.favourite ? '1' : '0';

    const imageDiv = document.createElement('div');
    imageDiv.className = 'gallery-square-image';
    setGalleryCover(imageDiv, `/api/gallery/cover_by_id/${encodeURIComponent(galleryId)}`);

    const titleDiv = document.createElement('div');
    titleDiv.className = 'gallery-square-title';
    titleDiv.textContent = title;

    const metaDiv = document.createElement('div');
    metaDiv.className = 'gallery-square-meta';

    const pagesChip = document.createElement('span');
    pagesChip.className = 'gallery-chip';
    pagesChip.textContent = `${pageCount} pages`;
    metaDiv.appendChild(pagesChip);

    if (status) {
      const statusChip = document.createElement('span');
      statusChip.className = 'gallery-chip status-chip';
      statusChip.textContent = status;
      metaDiv.appendChild(statusChip);
    }

    if (sourceFlags.length) {
      const sourceChip = document.createElement('span');
      sourceChip.className = 'gallery-chip';
      sourceChip.textContent = sourceFlags.join(' + ');
      metaDiv.appendChild(sourceChip);
    }

    const controlsDiv = document.createElement('div');
    controlsDiv.className = 'gallery-square-controls';

    const removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.className = 'remove-item-btn danger';
    removeBtn.dataset.galleryId = String(galleryId);
    removeBtn.textContent = 'Remove';
    controlsDiv.appendChild(removeBtn);

    card.appendChild(imageDiv);
    card.appendChild(titleDiv);
    card.appendChild(metaDiv);
    card.appendChild(controlsDiv);
    card.addEventListener('click', (event) => {
      // Left click: open detail modal
      if (event.button === 0) {
        openGalleryDetail(item);
      }
    });
    card.addEventListener('mousedown', (event) => {
      // Middle click: open reader route in new tab
      if (event.button === 1) {
        const collectionId = selectedCollectionId;
        const galleryId = Number(item.gallery_id || 0);
        if (collectionId && galleryId) {
          window.open(`/reader/collections/${collectionId}/${galleryId}/`, '_blank');
        }
      }
    });
    host.appendChild(card);
  });

  host.querySelectorAll('.remove-item-btn').forEach(btn => {
    btn.addEventListener('click', async event => {
      event.preventDefault();
      event.stopPropagation();
      if (!selectedCollectionId) return;
      const galleryId = Number(btn.dataset.galleryId);
      try {
        await api(`/api/collections/${selectedCollectionId}/remove_gallery`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ gallery_id: galleryId }),
        });
        await loadCollection(selectedCollectionId);
      } catch (err) {
        document.getElementById('editorMsg').textContent = err.message;
      }
    });
  });

  updateCollectionPaginationControls(totalPages, filteredCount);
}

async function loadCollections() {
  const data = await api('/api/collections/list');
  const host = document.getElementById('collectionList');
  const collections = Array.isArray(data.collections) ? data.collections : [];
  if (!collections.length) {
    host.innerHTML = '<p>No collections yet.</p>';
    return;
  }

  host.innerHTML = collections.map(item => {
    return `
      <div class="row-wrap">
        <a class="open-collection-btn" href="/collections/${item.id}/" data-id="${item.id}">${item.name}</a>
        <span>${item.collection_type} | ${item.total_count || 0} items</span>
      </div>
    `;
  }).join('');

  host.querySelectorAll('.open-collection-btn').forEach(btn => {
    btn.addEventListener('click', event => {
      event.preventDefault();
      const nextId = Number(btn.dataset.id || 0);
      if (!nextId) return;
      loadCollection(nextId, { pushUrl: true });
    });
  });
}

async function loadCollection(collectionId, options = {}) {
  const pushUrl = options.pushUrl !== false;
  selectedCollectionId = Number(collectionId);
  _collectionPage = 1;
  const data = await api(`/api/collections/${selectedCollectionId}`);
  const itemData = await api(`/api/collections/${selectedCollectionId}/items`);
  if (pushUrl) {
    _setCollectionUrl(selectedCollectionId);
  }

  document.getElementById('collectionEditor').style.display = '';
  document.getElementById('editorTitle').textContent = `${data.name} (${data.collection_type})`;
  document.getElementById('editCollectionName').value = data.name || '';
  document.getElementById('editCollectionDescription').value = data.description || '';
  document.getElementById('editCollectionSortMode').value = data.sort_mode || 'id_desc';
  document.getElementById('smartExpression').value = data.smart_expression || '';

  const sortSelect = document.getElementById('editCollectionSortMode');
  sortSelect.disabled = data.collection_type === 'smart';
  if (data.collection_type === 'smart') {
    sortSelect.value = 'id_desc';
  }

  const filterRows = Array.isArray(data.expressions) ? data.expressions : [];
  const filtersHost = document.getElementById('filterRows');
  filtersHost.innerHTML = '';
  filterRows.forEach((row, index) => {
    filtersHost.insertAdjacentHTML('beforeend', filterRowHtml(index, row));
  });

  renderItems(itemData.items || []);

  filtersHost.querySelectorAll('.remove-filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      btn.closest('.filter-row').remove();
    });
  });
}

async function createCollection() {
  const name = document.getElementById('newCollectionName').value.trim();
  const collectionType = document.getElementById('newCollectionType').value;
  const description = document.getElementById('newCollectionDescription').value.trim();
  const msg = document.getElementById('createCollectionMsg');
  if (!name) {
    msg.textContent = 'Collection name is required.';
    return;
  }

  try {
    await api('/api/collections/create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name,
        description,
        collection_type: collectionType,
        sort_mode: collectionType === 'smart' ? 'id_desc' : 'id_desc',
      }),
    });
    msg.textContent = 'Collection created.';
    document.getElementById('newCollectionName').value = '';
    document.getElementById('newCollectionDescription').value = '';
    await loadCollections();
  } catch (err) {
    msg.textContent = err.message;
  }
}

async function saveCollectionMeta() {
  if (!selectedCollectionId) return;
  const payload = {
    name: document.getElementById('editCollectionName').value.trim(),
    description: document.getElementById('editCollectionDescription').value.trim(),
    sort_mode: document.getElementById('editCollectionSortMode').value,
  };
  try {
    await api(`/api/collections/${selectedCollectionId}/update`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    document.getElementById('editorMsg').textContent = 'Collection updated.';
    await loadCollections();
    await loadCollection(selectedCollectionId);
  } catch (err) {
    document.getElementById('editorMsg').textContent = err.message;
  }
}

async function saveFilters() {
  if (!selectedCollectionId) return;
  const expressions = readFilterRows();
  try {
    await api(`/api/collections/${selectedCollectionId}/filters`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ expressions }),
    });
    document.getElementById('editorMsg').textContent = 'Filters saved.';
    await loadCollection(selectedCollectionId);
  } catch (err) {
    document.getElementById('editorMsg').textContent = err.message;
  }
}

async function saveSmartRule() {
  if (!selectedCollectionId) return;
  const expression = document.getElementById('smartExpression').value.trim();
  try {
    await api(`/api/collections/${selectedCollectionId}/rule`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ smart_expression: expression, confirm_rebuild: false }),
    });
    document.getElementById('editorMsg').textContent = 'Smart rule saved and rebuilt.';
    await loadCollection(selectedCollectionId);
  } catch (err) {
    if (err.status === 409 && err.payload && err.payload.requires_confirmation) {
      const ok = window.confirm(err.payload.error + '\n\nContinue?');
      if (ok) {
        try {
          await api(`/api/collections/${selectedCollectionId}/rule`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ smart_expression: expression, confirm_rebuild: true }),
          });
          document.getElementById('editorMsg').textContent = 'Smart rule saved and rebuilt.';
          await loadCollection(selectedCollectionId);
          return;
        } catch (err2) {
          document.getElementById('editorMsg').textContent = err2.message;
          return;
        }
      }
    }
    document.getElementById('editorMsg').textContent = err.message;
  }
}

async function refreshSmartCollection() {
  if (!selectedCollectionId) return;
  try {
    await api(`/api/collections/${selectedCollectionId}/refresh`, { method: 'POST' });
    document.getElementById('editorMsg').textContent = 'Smart collection refreshed.';
    await loadCollection(selectedCollectionId);
  } catch (err) {
    document.getElementById('editorMsg').textContent = err.message;
  }
}

async function addCreatorSnapshot() {
  if (!selectedCollectionId) return;
  const creator = document.getElementById('addCreatorInput').value.trim();
  if (!creator) return;
  try {
    await api(`/api/collections/${selectedCollectionId}/add_creator`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ creator }),
    });
    document.getElementById('addCreatorInput').value = '';
    await loadCollection(selectedCollectionId);
  } catch (err) {
    document.getElementById('editorMsg').textContent = err.message;
  }
}

async function addGalleryIds() {
  if (!selectedCollectionId) return;
  const ids = parseCommaSeparatedIds(document.getElementById('addGalleryIdsInput').value);
  if (!ids.length) return;
  try {
    await api(`/api/collections/${selectedCollectionId}/add_galleries`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ gallery_ids: ids }),
    });
    document.getElementById('addGalleryIdsInput').value = '';
    await loadCollection(selectedCollectionId);
  } catch (err) {
    document.getElementById('editorMsg').textContent = err.message;
  }
}

async function deleteCollection() {
  if (!selectedCollectionId) return;
  if (!window.confirm('Delete this collection?')) return;
  try {
    await api(`/api/collections/${selectedCollectionId}/delete`, { method: 'POST' });
    selectedCollectionId = null;
    document.getElementById('collectionEditor').style.display = 'none';
    _setCollectionsUrl();
    await loadCollections();
  } catch (err) {
    document.getElementById('editorMsg').textContent = err.message;
  }
}

document.getElementById('createCollectionBtn').addEventListener('click', createCollection);
document.getElementById('saveCollectionBtn').addEventListener('click', saveCollectionMeta);
document.getElementById('deleteCollectionBtn').addEventListener('click', deleteCollection);
document.getElementById('saveFiltersBtn').addEventListener('click', saveFilters);
document.getElementById('saveRuleBtn').addEventListener('click', saveSmartRule);
document.getElementById('refreshRuleBtn').addEventListener('click', refreshSmartCollection);
document.getElementById('addCreatorBtn').addEventListener('click', addCreatorSnapshot);
document.getElementById('addGalleryIdsBtn').addEventListener('click', addGalleryIds);
document.getElementById('addFilterRowBtn').addEventListener('click', () => {
  const host = document.getElementById('filterRows');
  const index = host.querySelectorAll('.filter-row').length;
  host.insertAdjacentHTML('beforeend', filterRowHtml(index, { filter_key: `F${index + 1}`, filter_type: 'tag', filter_value: '' }));
  host.querySelectorAll('.remove-filter-btn').forEach(btn => {
    btn.onclick = () => btn.closest('.filter-row').remove();
  });
});

document.getElementById('galleryDetailClose').addEventListener('click', closeGalleryDetail);
document.getElementById('galleryDetailModal').addEventListener('click', event => {
  if (event.target.id === 'galleryDetailModal') {
    closeGalleryDetail();
  }
});

document.getElementById('galleryDetailReadBtn').addEventListener('click', () => {
  if (!_detailGallery) return;
  const galleryId = Number(_detailGallery.gallery_id || 0);
  const cid = Number(selectedCollectionId || 0);
  if (!galleryId || !cid) return;
  const url = `/reader/collections/${cid}/${galleryId}/`;
  window.location.href = url;
});

document.getElementById('galleryDetailFavBtn').addEventListener('click', async () => {
  if (!_detailGallery || !_detailGallery.gallery_id) return;
  try {
    const target = !Boolean(_detailGallery.favourite);
    const value = await toggleGalleryFavourite(_detailGallery.gallery_id, target);
    _detailGallery.favourite = value;
    renderGalleryDetail(_detailGallery);
  } catch (err) {
    document.getElementById('editorMsg').textContent = err.message;
  }
});

document.getElementById('readerClose').addEventListener('click', closeReader);
document.getElementById('collectionPrevPageBtn').addEventListener('click', () => {
  if (_collectionPage > 1) {
    _collectionPage -= 1;
    renderItems(_allCollectionItems);
  }
});
document.getElementById('collectionNextPageBtn').addEventListener('click', () => {
  const totalPages = Math.ceil((_allCollectionItems.length || 0) / _collectionItemsPerPage) || 1;
  if (_collectionPage < totalPages) {
    _collectionPage += 1;
    renderItems(_allCollectionItems);
  }
});
document.getElementById('collectionItemsPerPageSelect').addEventListener('change', event => {
  _collectionItemsPerPage = normalisePageSize(event.target.value, _collectionItemsPerPage);
  _collectionPage = 1;
  renderItems(_allCollectionItems);
});
document.getElementById('prevBtn').addEventListener('click', () => {
  if (reader.index > 0) {
    reader.index -= 1;
    showPage();
  }
});
document.getElementById('nextBtn').addEventListener('click', () => {
  if (reader.index < reader.pages.length - 1) {
    reader.index += 1;
    showPage();
  }
});
document.addEventListener('keydown', event => {
  if (document.getElementById('readerOverlay').style.display === 'none') return;
  if (event.key === 'ArrowLeft' && reader.index > 0) {
    reader.index -= 1;
    showPage();
  }
  if (event.key === 'ArrowRight' && reader.index < reader.pages.length - 1) {
    reader.index += 1;
    showPage();
  }
  if (event.key === 'Escape') {
    closeReader();
  }
});

async function hydrateCollectionsRoute() {
  await loadCollections();

  if (!Number.isFinite(INITIAL_COLLECTION_ID) || INITIAL_COLLECTION_ID <= 0) {
    return;
  }

  await loadCollection(INITIAL_COLLECTION_ID, { pushUrl: false });
  if (!Number.isFinite(INITIAL_GALLERY_ID) || INITIAL_GALLERY_ID <= 0) {
    return;
  }

  const match = _allCollectionItems.find(item => Number(item.gallery_id || 0) === Number(INITIAL_GALLERY_ID));
  if (!match) {
    return;
  }

  await openGalleryDetail(match);
  _setCollectionGalleryUrl(INITIAL_COLLECTION_ID, INITIAL_GALLERY_ID);
}

hydrateCollectionsRoute();
refreshCollectionItemsPerPageSelect();
</script>
{% endblock %}
