{% extends "base.html" %}
{% block content %}
<h2>Creators</h2>
<div
	id="galleryViewerConfig"
	data-config='{{ (gallery_viewer_config or {}) | tojson }}'
	data-initial-creator-slug='{{ initial_creator_slug or "" }}'
	data-initial-gallery-id='{{ initial_gallery_id or "" }}'
	hidden
></div>

<div id="refreshToolbar">
	<button id="refreshGalleriesBtn" type="button">Refresh Galleries</button>
	<button id="toggleFilterBtn" type="button" title="Show or hide the search and filter bar">Hide Search And Filters</button>
	<span id="refreshStatus"></span>
</div>

<div id="modeTabs">
	<button class="modeTab active" data-mode="local">Local Galleries</button>
	<button class="modeTab" data-mode="stream">Stream Gallery by ID</button>
</div>

<div id="localPane" class="modePane">
	<div id="localNav">
		<span id="localBreadcrumb"><a href="#" id="crumbRoot">Creators</a></span>
	</div>

	<div id="searchFilterBar">
		<div class="filter-field">
			<label for="searchInput">Search Galleries</label>
			<input type="text" id="searchInput" placeholder="{{ gallery_viewer_config.searchPlaceholder if gallery_viewer_config else 'Search creators or galleries...' }}">
		</div>
		<div class="filter-group" id="filterGroup"></div>
	</div>

	<div id="localList" class="gallery-grid"></div>

	<div class="pagination-controls" id="paginationControls" style="display:none">
		<button id="prevPageBtn">← Previous</button>
		<span class="pagination-info">Page <span id="pageNum">1</span> of <span id="totalPages">1</span></span>
		<div class="filter-field filter-inline-field">
			<label for="itemsPerPageSelect">Items Per Page</label>
			<select id="itemsPerPageSelect" class="filter-select"></select>
		</div>
		<button id="nextPageBtn">Next →</button>
	</div>
</div>

<div id="streamPane" class="modePane" style="display:none">
	<div id="streamControls">
		<label for="streamIdInput">Gallery ID:</label>
		<input type="number" id="streamIdInput" min="1" placeholder="e.g. 123456">
		<button id="streamStartBtn">Open</button>
	</div>
	<p id="streamStatus">Enter a gallery ID and click Open.</p>
	<p id="streamPathInfo"></p>
</div>

<div id="readerOverlay" style="display:none">
	<div id="readerHeader">
		<button id="readerClose">&#x2715; Close</button>
		<span id="readerTitle"></span>
		<span id="readerCounter"></span>
		<button id="streamDownloadBtn" type="button" style="display:none">Download This Gallery</button>
	</div>
	<div id="readerBody">
		<button id="prevBtn" class="navBtn">&#8592;</button>
		<div id="readerImgWrap">
			<img id="readerImg" src="" alt="manga page">
		</div>
		<button id="nextBtn" class="navBtn">&#8594;</button>
	</div>
</div>

<div id="galleryDetailModal" class="detail-modal-bg" style="display:none">
	<div id="galleryDetailPanel" class="detail-modal-panel">
		<div class="detail-modal-header">
			<strong id="galleryDetailTitle">Gallery</strong>
			<button id="galleryDetailClose" type="button">&#x2715; Close</button>
		</div>
		<div class="detail-modal-body">
			<div class="detail-modal-layout">
				<div class="detail-modal-side">
					<div id="galleryDetailCover" class="detail-modal-cover" role="img" aria-label="Gallery cover"></div>
					<div class="detail-modal-actions-inline">
						<button id="galleryDetailReadBtn" type="button">Read Gallery</button>
						<button id="galleryDetailFavBtn" type="button" class="fav-btn">☆ Favourite</button>
					</div>
				</div>
				<div class="detail-modal-main">
					<p><strong>ID:</strong> <span id="galleryDetailId">Unknown</span></p>
					<p><strong>Creators:</strong> <span id="galleryDetailCreators">Unknown</span></p>
					<p><strong>Tags:</strong> <span id="galleryDetailTags">None</span></p>
					<p><strong>Languages:</strong> <span id="galleryDetailLanguages">Unknown</span></p>
					<p><strong>Pages:</strong> <span id="galleryDetailPages">0</span></p>
				</div>
			</div>
		</div>
	</div>
</div>

{% endblock %}

{% block scripts %}
<script>
'use strict';

const VIEWER_CONFIG = JSON.parse(document.getElementById('galleryViewerConfig').dataset.config || '{}');
const INITIAL_CREATOR_SLUG = String(document.getElementById('galleryViewerConfig').dataset.initialCreatorSlug || '').trim().toLowerCase();
const INITIAL_GALLERY_ID = Number(document.getElementById('galleryViewerConfig').dataset.initialGalleryId || 0);
const PAGE_SIZE_OPTIONS = VIEWER_CONFIG.galleryTilesPerPage || [7, 14, 21, 28, 35];

function normalisePageSize(value, fallback) {
	const numeric = Number(value);
	if (Number.isFinite(numeric) && PAGE_SIZE_OPTIONS.includes(numeric)) {
		return numeric;
	}
	return fallback;
}

document.documentElement.style.setProperty('--gallery-tile-min-width', `${Number(VIEWER_CONFIG.tileMinWidthPx || 120)}px`);
document.documentElement.style.setProperty('--gallery-tile-aspect-ratio', String(VIEWER_CONFIG.tileAspectRatio || '2 / 3'));

let _activeStreamId = null;
let _readerFromStream = false;
let _currentCreator = null;
let _allCreators = [];
let _allGalleries = [];
let _currentItemType = null;
let _currentPage = 1;
let _searchTerm = '';
let _activeFilters = {};
let _availableFilters = {};
let _pageSizeByType = {
	creators: normalisePageSize(VIEWER_CONFIG.creatorPageSize, PAGE_SIZE_OPTIONS[2]),
	galleries: normalisePageSize(VIEWER_CONFIG.galleryPageSize, PAGE_SIZE_OPTIONS[2]),
};
let _detailGallery = null;
let _currentRootPath = '';

const reader = {
	pages: [],
	index: 0,
	title: '',
	onClose: null
};

let _filterBarVisible = true;

// ── Utility ────────────────────────────────────────────────────────────────
async function apiFetch(url) {
	const res = await fetch(url);
	if (!res.ok) throw new Error(`HTTP ${res.status}`);
	return res.json();
}

function getItemsPerPage() {
	if (_currentItemType === 'galleries') {
		return _pageSizeByType.galleries;
	}
	return _pageSizeByType.creators;
}

function refreshItemsPerPageSelect() {
	const select = document.getElementById('itemsPerPageSelect');
	if (!select) return;
	if (!select.options.length) {
		PAGE_SIZE_OPTIONS.forEach(size => {
			const option = document.createElement('option');
			option.value = String(size);
			option.textContent = String(size);
			select.appendChild(option);
		});
	}
	const current = getItemsPerPage();
	select.value = String(current);
}

function normaliseText(value) {
	return String(value || '').trim().toLowerCase();
}

function stripGalleryId(title) {
    return String(title || '').replace(/^\(\d+\)\s*/, '').trim();
}

function normaliseList(values) {
	return Array.isArray(values) ? values.map(item => String(item || '').trim()).filter(Boolean) : [];
}

function itemLabel(item) {
	return typeof item === 'string' ? item : (item.label || item.name || 'Unknown');
}

function itemPathName(item) {
	return typeof item === 'string' ? item : (item.path_name || item.name || item.label || '');
}

function creatorSlug(name) {
	return encodeURIComponent(String(name || '').trim().toLowerCase());
}

function creatorMatchesSlug(name, slugText) {
	return String(name || '').trim().toLowerCase() === String(slugText || '').trim().toLowerCase();
}

function _setCreatorsUrl() {
	window.history.pushState({}, '', '/creators/');
}

function _setCreatorUrl(creatorName) {
	window.history.pushState({}, '', `/creators/${creatorSlug(creatorName)}`);
}

function _setCreatorGalleryUrl(creatorName, galleryId) {
	const gid = Number(galleryId || 0);
	if (!gid) {
		_setCreatorUrl(creatorName);
		return;
	}
	window.history.pushState({}, '', `/creators/${creatorSlug(creatorName)}/${gid}`);
}

function parseSearchQuery(raw) {
	const text = String(raw || '').trim();
	if (!text) return { field: '', term: '' };
	const match = text.match(/^([a-z_]+)\s*:\s*(.+)$/i);
	if (!match) return { field: '', term: text.toLowerCase() };
	return {
		field: String(match[1] || '').toLowerCase(),
		term: String(match[2] || '').trim().toLowerCase(),
	};
}

function parseGalleryId(value) {
	const text = String(value || '').trim();
	const match = text.match(/^\((\d+)\)/);
	if (!match) return null;
	const galleryId = Number(match[1]);
	return Number.isFinite(galleryId) ? galleryId : null;
}

function _withRoot(url) {
	if (!_currentRootPath) return url;
	const sep = url.includes('?') ? '&' : '?';
	return `${url}${sep}root=${encodeURIComponent(_currentRootPath)}`;
}

function createFilterField(labelText, inputElement) {
	const wrapper = document.createElement('div');
	wrapper.className = 'filter-field';
	const label = document.createElement('label');
	label.textContent = labelText;
	wrapper.appendChild(label);
	wrapper.appendChild(inputElement);
	return wrapper;
}

function createSelectFilter(key, labelText, options, allLabel) {
	const wrapper = document.createElement('div');
	wrapper.className = 'filter-field filter-inline-field';
	const label = document.createElement('label');
	label.textContent = labelText;
	wrapper.appendChild(label);
	const select = document.createElement('select');
	select.className = 'filter-select';
	const allOption = document.createElement('option');
	allOption.value = '';
	allOption.textContent = allLabel;
	select.appendChild(allOption);
	(options || []).forEach(value => {
		const option = document.createElement('option');
		option.value = String(value);
		option.textContent = String(value);
		select.appendChild(option);
	});
	select.value = String(_activeFilters[key] || '');
	select.addEventListener('change', () => {
		_activeFilters[key] = select.value;
		_currentPage = 1;
		refreshDisplay();
	});
	wrapper.appendChild(select);
	return wrapper;
}

function setupSearchAndFilters() {
	document.getElementById('searchInput').addEventListener('input', (e) => {
		_searchTerm = String(e.target.value || '');
		_currentPage = 1;
		refreshDisplay();
	});
}

function getFilteredItems() {
	let items = _currentItemType === 'creators' ? _allCreators : _allGalleries;

	if (_searchTerm) {
		const parsed = parseSearchQuery(_searchTerm);
		items = items.filter(item => {
			const languages = normaliseList(item.languages).map(normaliseText);
			const tags = normaliseList(item.tags).map(normaliseText);
			const creators = normaliseList(item.creators).map(normaliseText);
			const label = itemLabel(item).toLowerCase();
			const searchableParts = [itemLabel(item)];
			if (typeof item !== 'string') {
				searchableParts.push(...normaliseList(item.languages));
				searchableParts.push(...normaliseList(item.tags));
				const status = String(item.status || '').trim();
				if (status) searchableParts.push(status);
			}
			if (!parsed.term) {
				return true;
			}
			if (parsed.field === 'artist' || parsed.field === 'group' || parsed.field === 'creator') {
				return label.includes(parsed.term) || creators.some(value => value.includes(parsed.term));
			}
			if (parsed.field === 'tag' || parsed.field === 'character' || parsed.field === 'parody') {
				return tags.some(value => value.includes(parsed.term));
			}
			if (parsed.field === 'language' || parsed.field === 'lang') {
				return languages.some(value => value.includes(parsed.term));
			}
			return searchableParts.join(' ').toLowerCase().includes(parsed.term);
		});
	}

	items = items.filter(item => {
		const languages = normaliseList(item.languages).map(normaliseText);
		const tags = normaliseList(item.tags).map(normaliseText);

		if (_activeFilters.language && !languages.includes(normaliseText(_activeFilters.language))) {
			return false;
		}
		if (_activeFilters.tag && !tags.includes(normaliseText(_activeFilters.tag))) {
			return false;
		}
		return true;
	});

	return items;
}

function getPaginatedItems(items) {
	const filteredCount = items.length;
	const itemsPerPage = getItemsPerPage();
	const totalPages = Math.ceil(filteredCount / itemsPerPage) || 1;
	const startIdx = (_currentPage - 1) * itemsPerPage;
	const endIdx = startIdx + itemsPerPage;
	const paginatedItems = items.slice(startIdx, endIdx);

	return { items: paginatedItems, totalPages, filteredCount };
}

function updatePaginationControls(totalPages, filteredCount) {
	const controls = document.getElementById('paginationControls');
	const pageNumEl = document.getElementById('pageNum');
	const totalPagesEl = document.getElementById('totalPages');
	
	if (_currentPage > totalPages) {
		_currentPage = totalPages;
	}

	refreshItemsPerPageSelect();

	if (filteredCount <= 0) {
		controls.style.display = 'none';
	} else {
		controls.style.display = 'flex';
		pageNumEl.textContent = _currentPage;
		totalPagesEl.textContent = totalPages;
		document.getElementById('prevPageBtn').disabled = _currentPage === 1;
		document.getElementById('nextPageBtn').disabled = _currentPage === totalPages;
	}
}

function setupFiltersForCreators(filters) {
	const filterGroup = document.getElementById('filterGroup');
	filterGroup.innerHTML = '';
	filterGroup.appendChild(createSelectFilter('language', 'Language', filters.languages || [], 'All languages'));
	filterGroup.appendChild(createSelectFilter('tag', 'Tag', filters.tags || [], 'All tags'));
}

function setupFiltersForGalleries(filters) {
	const filterGroup = document.getElementById('filterGroup');
	filterGroup.innerHTML = '';
	filterGroup.appendChild(createSelectFilter('language', 'Language', filters.languages || [], 'All languages'));
	filterGroup.appendChild(createSelectFilter('tag', 'Tag', filters.tags || [], 'All tags'));
}

document.querySelectorAll('.modeTab').forEach(btn => {
	btn.addEventListener('click', () => {
		document.querySelectorAll('.modeTab').forEach(b => b.classList.remove('active'));
		document.querySelectorAll('.modePane').forEach(p => p.style.display = 'none');
		btn.classList.add('active');
		const pane = document.getElementById(btn.dataset.mode + 'Pane');
		if (pane) pane.style.display = '';
	});
});

async function toggleCreatorFavourite(creatorName, targetValue) {
	const status = document.getElementById('refreshStatus');
	try {
		const res = await fetch('/api/gallery/favourite/creator', {
			method: 'POST',
			headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify({ creator: creatorName, favourite: targetValue }),
		});
		if (!res.ok) throw new Error(`HTTP ${res.status}`);
		const data = await res.json();
		const isFav = Boolean(data.favourite);
		_allCreators.forEach(item => {
			if (itemLabel(item) === creatorName) {
				item.favourite = isFav;
			}
		});
		status.textContent = `${creatorName} ${isFav ? 'favourited' : 'unfavourited'}.`;
		refreshDisplay();
	} catch (err) {
		status.textContent = `Could not update creator favourite: ${err.message}`;
	}
}

async function toggleGalleryFavourite(galleryId, galleryName, targetValue) {
	const status = document.getElementById('refreshStatus');
	if (!galleryId) {
		status.textContent = 'This gallery is not in the database yet.';
		return null;
	}
	try {
		const res = await fetch(`/api/gallery/favourite/gallery/${encodeURIComponent(galleryId)}`, {
			method: 'POST',
			headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify({ favourite: targetValue }),
		});
		if (!res.ok) throw new Error(`HTTP ${res.status}`);
		const data = await res.json();
		const isFav = Boolean(data.favourite);
		_allGalleries.forEach(item => {
			if (Number(item.gallery_id || 0) === Number(galleryId)) {
				item.favourite = isFav;
			}
		});
		status.textContent = `${galleryName} ${isFav ? 'favourited' : 'unfavourited'}.`;
		refreshDisplay();
		return isFav;
	} catch (err) {
		status.textContent = `Could not update gallery favourite: ${err.message}`;
		return null;
	}
}

function _renderGalleryDetail(gallery) {
	const rawTitle = String(gallery.label || gallery.name || 'Gallery');
	const title = rawTitle;
	const pageCount = Number(gallery.page_count || 0);
	const languageList = normaliseList(gallery.languages);
	const tagList = normaliseList(gallery.tags);
	const creatorList = normaliseList(gallery.creators);
	const galleryId = Number(gallery.gallery_id || 0);
	let coverUrl = '';
	if (galleryId > 0) {
		coverUrl = `/api/gallery/cover_by_id/${encodeURIComponent(galleryId)}`;
	} else if (_currentCreator) {
		coverUrl = `/api/gallery/cover/${encodeURIComponent(_currentCreator)}/${encodeURIComponent(title)}`;
	}

	document.getElementById('galleryDetailTitle').textContent = title;
	document.getElementById('galleryDetailId').textContent = galleryId > 0 ? String(galleryId) : 'Unknown';
	document.getElementById('galleryDetailCreators').textContent = creatorList.length ? creatorList.join(', ') : 'Unknown';
	document.getElementById('galleryDetailTags').textContent = tagList.length ? tagList.join(', ') : 'None';
	document.getElementById('galleryDetailLanguages').textContent = languageList.length ? languageList.join(', ') : 'Unknown';
	document.getElementById('galleryDetailPages').textContent = String(pageCount);

	const coverEl = document.getElementById('galleryDetailCover');
	coverEl.style.backgroundImage = coverUrl ? `url('${coverUrl}')` : '';

	const favBtn = document.getElementById('galleryDetailFavBtn');
	favBtn.className = 'fav-btn' + (gallery.favourite ? ' fav-active' : '');
	favBtn.textContent = gallery.favourite ? '★ Unfavourite' : '☆ Favourite';
}

async function openGalleryDetail(gallery) {
	_detailGallery = { ...gallery, creators: (_currentCreator ? [_currentCreator] : []) };
	if (!_detailGallery.gallery_id) {
		_detailGallery.gallery_id = parseGalleryId(itemLabel(gallery));
	}
	_renderGalleryDetail(_detailGallery);
	document.getElementById('galleryDetailModal').style.display = '';

	if (!_currentCreator) return;
	try {
		let data;
		if (_detailGallery.gallery_id) {
			data = await apiFetch(`/api/gallery/details_by_id/${encodeURIComponent(_detailGallery.gallery_id)}`);
		} else {
			const creatorName = encodeURIComponent(_currentCreator);
			const galleryName = encodeURIComponent(itemPathName(gallery));
			data = await apiFetch(_withRoot(`/api/gallery/details/${creatorName}/${galleryName}`));
		}

		if (data.gallery_id) {
			_detailGallery.gallery_id = data.gallery_id;
		}
		_detailGallery.page_count = Number(data.page_count || _detailGallery.page_count || 0);
		_detailGallery.languages = Array.isArray(data.languages) ? data.languages : (_detailGallery.languages || []);
		_detailGallery.tags = Array.isArray(data.tags) ? data.tags : (_detailGallery.tags || []);
		_detailGallery.status = String(data.status || _detailGallery.status || '');
		if (Array.isArray(data.creators) && data.creators.length) {
			_detailGallery.creators = data.creators;
		} else if (data.creator) {
			_detailGallery.creators = [String(data.creator)];
		} else if (!_detailGallery.creators || !_detailGallery.creators.length) {
			_detailGallery.creators = _currentCreator ? [_currentCreator] : [];
		}
		_detailGallery.favourite = Boolean(data.favourite);

		for (const item of _allGalleries) {
			if (itemLabel(item) === itemLabel(_detailGallery)) {
				if (_detailGallery.gallery_id) item.gallery_id = _detailGallery.gallery_id;
				item.languages = _detailGallery.languages;
				item.tags = _detailGallery.tags;
				item.tag_count = _detailGallery.tags.length;
				item.status = _detailGallery.status;
				item.favourite = _detailGallery.favourite;
				item.page_count = _detailGallery.page_count;
			}
		}
		_renderGalleryDetail(_detailGallery);
	} catch (err) {
		document.getElementById('refreshStatus').textContent = `Could not load gallery metadata: ${err.message}`;
	}
}

function closeGalleryDetail() {
	_detailGallery = null;
	document.getElementById('galleryDetailModal').style.display = 'none';
}

function createGalleryGrid(items, itemType, onClick) {
	const el = document.getElementById('localList');
	el.innerHTML = '';
	el.className = 'gallery-grid';
	
	if (!items.length) {
		el.textContent = 'Nothing here.';
		el.className = '';
		return;
	}

	items.forEach(item => {
		const square = document.createElement('div');
		square.className = 'gallery-square';

		const imageDiv = document.createElement('div');
		imageDiv.className = 'gallery-square-image';

		const label = itemLabel(item);

		if (itemType === 'creator') {
			const coverUrl = `/api/gallery/cover/${encodeURIComponent(label)}`;
			imageDiv.style.backgroundImage = `url('${coverUrl}')`;
		} else if (itemType === 'gallery') {
			const creator = _currentCreator || '';
			const coverUrl = `/api/gallery/cover/${encodeURIComponent(creator)}/${encodeURIComponent(itemPathName(item))}`;
			imageDiv.style.backgroundImage = `url('${coverUrl}')`;
		}

		const titleDiv = document.createElement('div');
		titleDiv.className = 'gallery-square-title';
		titleDiv.textContent = label;

		const metaDiv = document.createElement('div');
		metaDiv.className = 'gallery-square-meta';
		const controlsDiv = document.createElement('div');
		controlsDiv.className = 'gallery-square-controls';
		if (itemType === 'creator') {
			const galleryChip = document.createElement('span');
			galleryChip.className = 'gallery-chip';
			galleryChip.textContent = `${Number(item.gallery_count || 0)} galleries`;
			metaDiv.appendChild(galleryChip);
			if (Array.isArray(item.languages) && item.languages.length) {
				const languageChip = document.createElement('span');
				languageChip.className = 'gallery-chip';
				languageChip.textContent = item.languages[0];
				metaDiv.appendChild(languageChip);
			}
		} else {
			const pagesChip = document.createElement('span');
			pagesChip.className = 'gallery-chip';
			pagesChip.textContent = `${Number(item.page_count || 0)} pages`;
			metaDiv.appendChild(pagesChip);
			if (Array.isArray(item.languages) && item.languages.length) {
				const languageChip = document.createElement('span');
				languageChip.className = 'gallery-chip';
				languageChip.textContent = item.languages[0];
				metaDiv.appendChild(languageChip);
			}
		}

		if (itemType === 'creator') {
			const favBtn = document.createElement('button');
			favBtn.type = 'button';
			favBtn.className = 'fav-btn' + (item.favourite ? ' fav-active' : '');
			favBtn.textContent = item.favourite ? '★ Unfavourite' : '☆ Favourite';
			favBtn.addEventListener('click', event => {
				event.preventDefault();
				event.stopPropagation();
				const newTarget = !Boolean(item.favourite);
				toggleCreatorFavourite(label, newTarget);
			});
			controlsDiv.appendChild(favBtn);
		}

		square.appendChild(imageDiv);
		square.appendChild(titleDiv);
		square.appendChild(metaDiv);
		square.appendChild(controlsDiv);

		square.addEventListener('mousedown', (event) => {
			if (itemType === 'gallery' && event.button === 1) {
				// Middle click: open reader in new tab
				const creator = _currentCreator;
				const galleryId = typeof item === 'object' && item.gallery_id ? item.gallery_id : parseGalleryId(itemLabel(item));
				if (creator && galleryId) {
					window.open(`/reader/creators/${creatorSlug(creator)}/${galleryId}/`, '_blank');
				}
			}
		});
		square.addEventListener('click', () => {
			if (itemType === 'creator') {
				onClick(itemLabel(item));
				return;
			}
			openGalleryDetail(item);
		});
		el.appendChild(square);
	});
}

function setBreadcrumb(parts) {
	const el = document.getElementById('localBreadcrumb');
	el.innerHTML = '';
	parts.forEach((part, i) => {
		if (i > 0) { const sep = document.createTextNode(' / '); el.appendChild(sep); }
		const a = document.createElement('a');
		a.href = '#';
		a.textContent = part.label;
		if (part.onClick) a.addEventListener('click', e => { e.preventDefault(); part.onClick(); });
		el.appendChild(a);
	});
}

function refreshDisplay() {
	const filteredItems = getFilteredItems();
	const { items, totalPages, filteredCount } = getPaginatedItems(filteredItems);

	if (_currentItemType === 'creators') {
		createGalleryGrid(items, 'creator', loadGalleries);
	} else if (_currentItemType === 'galleries') {
		createGalleryGrid(items, 'gallery', item => loadPages(_currentCreator, item));
	}

	updatePaginationControls(totalPages, filteredCount);
}

async function loadCreators(options = {}) {
	const pushUrl = options.pushUrl !== false;
	setBreadcrumb([{ label: '' }]); // Label formerly "Creators"
	_currentCreator = null;
	_currentItemType = 'creators';
	_currentPage = 1;
	_searchTerm = '';
	_activeFilters = {};
	_availableFilters = {};

	document.getElementById('searchInput').value = '';
	setupFiltersForCreators({});
	if (pushUrl) {
		_setCreatorsUrl();
	}

	document.getElementById('localList').textContent = 'Loading creators...';
	document.getElementById('localList').className = '';
	try {
		const data = await apiFetch('/api/gallery/list_creators');
		_allCreators = data.creators || [];
		_availableFilters = data.filters || {};
		_currentRootPath = String(data.root_path || '');
		setupFiltersForCreators(_availableFilters);
		refreshDisplay();
	} catch (err) {
		document.getElementById('localList').textContent = 'Error: ' + err.message;
		document.getElementById('localList').className = '';
	}
}

async function loadGalleries(creator, options = {}) {
	const creatorName = itemLabel(creator);
	const pushUrl = options.pushUrl !== false;
	_currentCreator = creatorName;
	_currentItemType = 'galleries';
	_currentPage = 1;
	_searchTerm = '';
	_activeFilters = {};
	_availableFilters = {};

	setBreadcrumb([
		{ label: 'Creators', onClick: loadCreators },
		{ label: creatorName }
	]);
	if (pushUrl) {
		_setCreatorUrl(creatorName);
	}

	document.getElementById('searchInput').value = '';
	setupFiltersForGalleries({});

	document.getElementById('localList').textContent = 'Loading galleries...';
	document.getElementById('localList').className = '';
	try {
		const data = await apiFetch(_withRoot(`/api/gallery/list_galleries/${encodeURIComponent(creatorName)}`));
		_allGalleries = Array.isArray(data.galleries) ? data.galleries : [];
		_availableFilters = data.filters || {};
		_currentRootPath = String(data.root_path || _currentRootPath || '');
		setupFiltersForGalleries(_availableFilters);
		refreshDisplay();
	} catch (err) {
		document.getElementById('localList').textContent = 'Error: ' + err.message;
		document.getElementById('localList').className = '';
	}
}

async function loadPages(creator, gallery, options = {}) {
	const pushUrl = options.pushUrl !== false;
	const galleryDisplayName = itemLabel(gallery);
	const galleryPathName = itemPathName(gallery);
	const galleryId = Number((typeof gallery === 'object' && gallery !== null ? gallery.gallery_id : null) || parseGalleryId(galleryDisplayName) || 0);
	if (pushUrl) {
		_setCreatorGalleryUrl(creator, galleryId);
	}
	
	setBreadcrumb([
		{ label: 'Creators', onClick: loadCreators },
		{ label: creator, onClick: () => loadGalleries(creator) },
		{ label: galleryDisplayName }
	]);
	try {
		let data;
		let pages = [];
		if (galleryId && Number.isFinite(galleryId) && galleryId > 0) {
			// Prefer ID-based endpoints when we have a gallery_id (avoids path/name mismatches)
			data = await apiFetch(_withRoot(`/api/gallery/list_pages_by_id/${encodeURIComponent(galleryId)}`));
			const root = String(data.root_path || '');
			pages = (data.pages || []).map(name => {
				const base = `/api/gallery/view_by_id/${encodeURIComponent(galleryId)}/${encodeURIComponent(name)}`;
				return root ? `${base}?root=${encodeURIComponent(root)}` : base;
			});
		} else {
			data = await apiFetch(_withRoot(`/api/gallery/list_pages/${encodeURIComponent(creator)}/${encodeURIComponent(galleryPathName)}`));
			pages = (data.pages || []).map(
				f => _withRoot(`/api/gallery/view/${encodeURIComponent(creator)}/${encodeURIComponent(galleryPathName)}/${encodeURIComponent(f)}`)
			);
		}
		if (!pages.length) {
			document.getElementById('localList').textContent = 'Gallery is empty.';
			document.getElementById('localList').className = '';
			return;
		}
		_readerFromStream = false;
		// Use full title for now (do not strip numeric prefix)
		openReader(pages, galleryDisplayName, () => {
			document.getElementById('localPane').style.display = '';
			loadGalleries(creator);
		});
	} catch (err) {
		document.getElementById('localList').textContent = 'Error: ' + err.message;
		document.getElementById('localList').className = '';
	}
}

document.getElementById('prevPageBtn').addEventListener('click', () => {
	if (_currentPage > 1) {
		_currentPage--;
		refreshDisplay();
	}
});

document.getElementById('nextPageBtn').addEventListener('click', () => {
	const filteredItems = getFilteredItems();
	const totalPages = Math.ceil(filteredItems.length / getItemsPerPage()) || 1;
	if (_currentPage < totalPages) {
		_currentPage++;
		refreshDisplay();
	}
});

document.getElementById('itemsPerPageSelect').addEventListener('change', event => {
	const selected = normalisePageSize(event.target.value, getItemsPerPage());
	if (_currentItemType === 'galleries') {
		_pageSizeByType.galleries = selected;
	} else {
		_pageSizeByType.creators = selected;
	}
	_currentPage = 1;
	refreshDisplay();
});

document.getElementById('streamStartBtn').addEventListener('click', startStream);
document.getElementById('streamDownloadBtn').addEventListener('click', downloadStreamGallery);
document.getElementById('streamIdInput').addEventListener('keydown', e => {
	if (e.key === 'Enter') startStream();
});

async function startStream() {
	const input = document.getElementById('streamIdInput');
	const status = document.getElementById('streamStatus');
	const id = parseInt(input.value, 10);
	if (!id || id < 1) { status.textContent = 'Please enter a valid gallery ID.'; return; }

	status.textContent = `Fetching metadata for #${id}...`;
	try {
		const data = await apiFetch(`/api/gallery/stream/${id}`);
		if (data.error) { status.textContent = 'Error: ' + data.error; return; }
		_activeStreamId = id;
		_readerFromStream = true;
		status.textContent = `Loaded ${data.page_count} pages. Opening reader...`;
		openReader(data.page_urls, data.title || `Gallery #${id}`, closeStream);
	} catch (err) {
		status.textContent = 'Failed: ' + err.message;
	}
}

async function downloadStreamGallery() {
	const input = document.getElementById('streamIdInput');
	const status = document.getElementById('streamStatus');
	const id = parseInt(input.value, 10);
	if (!id || id < 1) {
		status.textContent = 'Please enter a valid gallery ID first.';
		return;
	}
	try {
		await fetch('/api/scraper/queue/add', {
			method: 'POST',
			headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify({ ids: [id] })
		});
		status.textContent = `Gallery #${id} added to queue.`;
	} catch (err) {
		status.textContent = `Could not queue gallery #${id}: ${err.message}`;
	}
}

async function closeStream() {
	if (_activeStreamId === null) return;
	try {
		await fetch(`/api/gallery/stream/${_activeStreamId}/close`, { method: 'POST' });
	} catch { /* best effort */ }
	_activeStreamId = null;
	document.getElementById('streamPathInfo').textContent = '';
	document.getElementById('streamStatus').textContent = 'Session closed.';
}

function openReader(pages, title, onClose) {
	reader.pages = pages;
	reader.index = 0;
	reader.title = title;
	reader.onClose = onClose;
	document.getElementById('readerTitle').textContent = title;
	document.getElementById('streamDownloadBtn').style.display = _readerFromStream ? '' : 'none';
	document.getElementById('localPane').style.display = 'none';
	document.getElementById('streamPane').style.display = 'none';
	document.getElementById('readerOverlay').style.display = '';
	showPage();
}

function showPage() {
	const img = document.getElementById('readerImg');
	const counter = document.getElementById('readerCounter');
	img.src = reader.pages[reader.index];
	counter.textContent = `${reader.index + 1} / ${reader.pages.length}`;
	document.getElementById('prevBtn').disabled = reader.index === 0;
	document.getElementById('nextBtn').disabled = reader.index === reader.pages.length - 1;
}

document.getElementById('prevBtn').addEventListener('click', () => {
	if (reader.index > 0) { reader.index--; showPage(); }
});
document.getElementById('nextBtn').addEventListener('click', () => {
	if (reader.index < reader.pages.length - 1) { reader.index++; showPage(); }
});
document.addEventListener('keydown', e => {
	if (document.getElementById('readerOverlay').style.display === 'none') return;
	if (e.key === 'ArrowLeft' && reader.index > 0) { reader.index--; showPage(); }
	if (e.key === 'ArrowRight' && reader.index < reader.pages.length - 1) { reader.index++; showPage(); }
	if (e.key === 'Escape') closeReader();
});

document.getElementById('readerClose').addEventListener('click', closeReader);
function closeReader() {
	document.getElementById('readerOverlay').style.display = 'none';
	document.getElementById('streamDownloadBtn').style.display = 'none';
	// Re-show the active mode pane
	const activeMode = document.querySelector('.modeTab.active').dataset.mode;
	document.getElementById(activeMode + 'Pane').style.display = '';
	if (reader.onClose) reader.onClose();
}

async function refreshGalleries() {
	const btn = document.getElementById('refreshGalleriesBtn');
	const status = document.getElementById('refreshStatus');
	btn.disabled = true;
	status.textContent = 'Scanning...';
	try {
		// Rescan disk and update database
		await fetch('/api/gallery/refresh', { method: 'POST' });
		status.textContent = 'Galleries refreshed!';
		// Reload current view
		if (_currentItemType === 'creators') {
			loadCreators();
		} else if (_currentItemType === 'galleries' && _currentCreator) {
			loadGalleries(_currentCreator);
		}
		setTimeout(() => { status.textContent = ''; }, 3000);
	} catch (err) {
		status.textContent = `Error: ${err.message}`;
		setTimeout(() => { status.textContent = ''; }, 5000);
	} finally {
		btn.disabled = false;
	}
}

document.getElementById('refreshGalleriesBtn').addEventListener('click', refreshGalleries);

document.getElementById('toggleFilterBtn').addEventListener('click', () => {
	_filterBarVisible = !_filterBarVisible;
	document.getElementById('searchFilterBar').style.display = _filterBarVisible ? '' : 'none';
	document.getElementById('toggleFilterBtn').textContent = _filterBarVisible ? 'Hide Search And Filters' : 'Show Search And Filters';
});

document.getElementById('galleryDetailClose').addEventListener('click', closeGalleryDetail);
document.getElementById('galleryDetailModal').addEventListener('click', e => {
	if (e.target.id === 'galleryDetailModal') closeGalleryDetail();
});
document.getElementById('galleryDetailReadBtn').addEventListener('click', () => {
	if (!_detailGallery) return;
	const galleryId = Number(_detailGallery.gallery_id || parseGalleryId(itemLabel(_detailGallery)) || 0);
	const creatorName = _currentCreator || (Array.isArray(_detailGallery.creators) && _detailGallery.creators[0]) || '';
	if (!creatorName || !galleryId) return;
	closeGalleryDetail();
	// Navigate to standalone reader page
	window.location.href = `/reader/creators/${creatorSlug(creatorName)}/${galleryId}/`;
});
document.getElementById('galleryDetailFavBtn').addEventListener('click', async () => {
	if (!_detailGallery) return;
	const galleryName = itemLabel(_detailGallery);
	if (!_detailGallery.gallery_id) {
		_detailGallery.gallery_id = parseGalleryId(galleryName);
	}
	const newTarget = !Boolean(_detailGallery.favourite);
	const isFav = await toggleGalleryFavourite(_detailGallery.gallery_id, galleryName, newTarget);
	if (isFav === null) return;
	_detailGallery.favourite = isFav;
	_renderGalleryDetail(_detailGallery);
});

async function hydrateGalleryRoute() {
	if (!INITIAL_CREATOR_SLUG) {
		await loadCreators({ pushUrl: false });
		return;
	}

	await loadCreators({ pushUrl: false });
	const creatorMatch = _allCreators.find(item => creatorMatchesSlug(itemLabel(item), INITIAL_CREATOR_SLUG));
	if (!creatorMatch) {
		return;
	}

	await loadGalleries(itemLabel(creatorMatch), { pushUrl: false });
	if (!Number.isFinite(INITIAL_GALLERY_ID) || INITIAL_GALLERY_ID <= 0) {
		return;
	}

	const galleryMatch = _allGalleries.find(item => Number(item.gallery_id || 0) === Number(INITIAL_GALLERY_ID));
	if (!galleryMatch) {
		return;
	}
	await loadPages(itemLabel(creatorMatch), galleryMatch, { pushUrl: false });
}

setupSearchAndFilters();
refreshItemsPerPageSelect();
hydrateGalleryRoute();
</script>
{% endblock %}
