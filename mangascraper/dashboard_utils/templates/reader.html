{% extends "base.html" %}
{% block content %}
<h2>Gallery Reader</h2>
<div id="readerOverlay">
  <div id="readerHeader">
    <button id="readerClose">&#x2715; Close</button>
    <span id="readerTitle">{{ gallery.title }}</span>
    <span id="readerCounter">Page <span id="pageNum">1</span> / {{ pages|length }}</span>
    <button id="streamDownloadBtn" type="button">Download This Gallery</button>
  </div>
  <div id="readerBody">
    <button id="prevBtn" class="navBtn">&#8592;</button>
    <div id="readerImgWrap">
      {% if pages|length > 0 %}
        <img id="readerImg" src="{{ url_for('static', filename='gallery/' ~ gallery.gallery_id ~ '/' ~ pages[0]) }}" alt="manga page">
      {% else %}
        <div>No pages found.</div>
      {% endif %}
    </div>
    <button id="nextBtn" class="navBtn">&#8594;</button>
  </div>
  <div style="display:none">
    <ul id="pageList">
      {% for page in pages %}
        <li data-page="{{ loop.index }}" data-src="{{ url_for('static', filename='gallery/' ~ gallery.gallery_id ~ '/' ~ page) }}">{{ page }}</li>
      {% endfor %}
    </ul>
  </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
  let currentPage = 1;
  const totalPages = parseInt(document.getElementById('readerCounter').textContent.split('/')[1]);
  const pageList = Array.from(document.querySelectorAll('#pageList li')).map(li => li.getAttribute('data-src'));
  const readerImg = document.getElementById('readerImg');
  const pageNum = document.getElementById('pageNum');
  document.getElementById('prevBtn').onclick = function() {
    if (currentPage > 1) {
      currentPage--;
      readerImg.src = pageList[currentPage-1];
      pageNum.textContent = currentPage;
    }
  };
  document.getElementById('nextBtn').onclick = function() {
    if (currentPage < totalPages) {
      currentPage++;
      readerImg.src = pageList[currentPage-1];
      pageNum.textContent = currentPage;
    }
  };
});
</script>
{% endblock %}
