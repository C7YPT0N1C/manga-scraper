{% extends "base.html" %}
{% block content %}
<div id="readerContext" data-config='{{ ({'viewer': gallery_viewer_config, 'context': reader_context} ) | tojson }}' hidden></div>

<div class="panel">
  <div style="display:flex; align-items:center; gap:1rem;">
    <button id="readerBack" type="button">← Back</button>
    <h2 id="readerTitle">Reader</h2>
  </div>
  <div id="readerWrapper" style="display:flex; align-items:center; justify-content:center; gap:1rem;">
    <button id="prevBtn" class="navBtn">←</button>
    <div id="readerImgWrap">
      <img id="readerImg" src="" alt="page" />
    </div>
    <button id="nextBtn" class="navBtn">→</button>
  </div>
  <p id="readerCounter" style="margin-top:0.5rem"></p>
</div>

<style>
/* Reader sizing: hide topbar and collapse dynamic bar on open */
/* header hidden so reader appears above navigation */
header.topbar { display: none !important; }

/* Reader sizing: constrain wrapper and image so both scale to viewport
   and remain centered. Reader takes the full viewport height when open. */
#readerWrapper {
  height: 100vh;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.12s ease;
  transform-origin: top center;
}

#readerImgWrap {
  max-width: 90vw;
  width: 90vw;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 1;
  overflow: auto;
  max-height: calc(100vh - 120px);
}

#readerImg {
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
  display: block;
  margin: 0 auto;
}

/* Reader-specific nav button overrides to prevent huge buttons */
#readerWrapper .navBtn {
  height: auto;
  padding: 0.4rem 0.6rem;
  min-width: 44px;
  font-size: 1.25rem;
  align-self: center;
}
</style>

{% endblock %}

{% block scripts %}
<script>
"use strict";
const RAW = JSON.parse(document.getElementById('readerContext').dataset.config || '{}');
const VIEWER_CONFIG = RAW.viewer || {};
const CTX = RAW.context || {};
const GALLERY_ID = Number(CTX.gallery_id || 0);

const reader = {
  pages: [],
  index: 0,
  title: '',
  onClose: null,
};

function showPage() {
  const img = document.getElementById('readerImg');
  const counter = document.getElementById('readerCounter');
  const wrapper = document.getElementById('readerWrapper');
  // clear any previous explicit sizing so we can measure natural layout
  wrapper.style.transform = '';
  wrapper.style.width = '';
  wrapper.style.height = '';
  img.src = reader.pages[reader.index] || '';
  counter.textContent = `${reader.index + 1} / ${reader.pages.length}`;
  document.getElementById('prevBtn').disabled = reader.index === 0;
  document.getElementById('nextBtn').disabled = reader.index >= reader.pages.length - 1;
  // when image loads, adjust scale to avoid scrollbars
  img.onload = () => { adjustReaderScale(); };
}

function adjustReaderScale() {
  const wrapper = document.getElementById('readerWrapper');
  if (!wrapper) return;
  // remove transforms to measure true layout
  wrapper.style.transform = '';
  wrapper.style.width = '';
  wrapper.style.height = '';

  requestAnimationFrame(() => {
    const totalHeight = wrapper.scrollHeight || wrapper.offsetHeight || 1;
    const viewport = Math.max(100, window.innerHeight - 8);
    if (totalHeight <= viewport) {
      wrapper.style.transform = '';
      wrapper.style.width = '';
      wrapper.style.height = '';
      return;
    }
    const scale = Math.max(0.5, (viewport - 8) / totalHeight);
    // apply visual scale and reduce layout size so scrollbar disappears
    const currentWidth = wrapper.offsetWidth || wrapper.clientWidth || wrapper.scrollWidth || 0;
    wrapper.style.transform = `scale(${scale})`;
    wrapper.style.width = `${Math.round(currentWidth * scale)}px`;
    wrapper.style.height = `${Math.round(totalHeight * scale)}px`;
  });
}

function openReader(pages, title, onClose) {
  reader.pages = pages;
  reader.index = 0;
  reader.title = title || '';
  reader.onClose = onClose || null;
  document.getElementById('readerTitle').textContent = reader.title;
  document.getElementById('readerCounter').textContent = '';
  // collapse dynamic bar while reader is open, preserving previous state
  try {
    if (typeof window.__dynamicBarCollapsed !== 'undefined') {
      window.__dynamicBarCollapsed__prev = !!window.__dynamicBarCollapsed;
    } else {
      window.__dynamicBarCollapsed__prev = localStorage.getItem('mangascraper.dynamicBarCollapsed') === '1';
    }
    window.__dynamicBarCollapsed = true;
    if (typeof _applyDynamicBarCollapsedState === 'function') _applyDynamicBarCollapsedState();
    if (typeof _saveDynamicBarCollapsedState === 'function') _saveDynamicBarCollapsedState(true);
  } catch (e) {}

  showPage();
}

function closeReader() {
  // restore dynamic bar collapsed state if we changed it
  try {
    if (typeof window.__dynamicBarCollapsed__prev !== 'undefined') {
      window.__dynamicBarCollapsed = !!window.__dynamicBarCollapsed__prev;
      if (typeof _applyDynamicBarCollapsedState === 'function') _applyDynamicBarCollapsedState();
      if (typeof _saveDynamicBarCollapsedState === 'function') _saveDynamicBarCollapsedState(!!window.__dynamicBarCollapsed__prev);
      delete window.__dynamicBarCollapsed__prev;
    }
  } catch (e) {}
  if (reader.onClose) reader.onClose();
}

document.getElementById('prevBtn').addEventListener('click', () => {
  if (reader.index > 0) { reader.index -= 1; showPage(); }
});
document.getElementById('nextBtn').addEventListener('click', () => {
  if (reader.index < reader.pages.length - 1) { reader.index += 1; showPage(); }
});
document.addEventListener('keydown', e => {
  if (document.getElementById('readerImg').src === '') return;
  if (e.key === 'ArrowLeft' && reader.index > 0) { reader.index--; showPage(); }
  if (e.key === 'ArrowRight' && reader.index < reader.pages.length - 1) { reader.index++; showPage(); }
  if (e.key === 'Escape') closeReader();
});

// Recompute scale when the window changes size
window.addEventListener('resize', () => { adjustReaderScale(); });

document.getElementById('readerBack').addEventListener('click', () => {
  if (history.length > 1) { history.back(); return; }
  if (CTX.type === 'creators') {
    window.location.href = `/creators/${encodeURIComponent(CTX.creator || '')}/`;
  } else if (CTX.type === 'collections') {
    window.location.href = `/collections/${encodeURIComponent(CTX.collection_id || '')}/`;
  } else {
    window.location.href = '/';
  }
});

async function loadPages() {
  if (!GALLERY_ID) { document.getElementById('readerTitle').textContent = 'Missing gallery id'; return; }
  try {
    const res = await fetch(`/api/gallery/list_pages_by_id/${encodeURIComponent(GALLERY_ID)}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const root = String(data.root_path || '');
    const pages = (data.pages || []).map(name => {
      const base = `/api/gallery/view_by_id/${encodeURIComponent(GALLERY_ID)}/${encodeURIComponent(name)}`;
      return root ? `${base}?root=${encodeURIComponent(root)}` : base;
    });
    if (!pages.length) throw new Error('Gallery is empty');
    openReader(pages, String(data.title || `Gallery ${GALLERY_ID}`));
  } catch (err) {
    document.getElementById('readerTitle').textContent = `Could not load gallery: ${err.message}`;
  }
}

loadPages();
</script>
{% endblock %}
