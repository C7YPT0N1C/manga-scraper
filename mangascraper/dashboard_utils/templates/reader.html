{% extends "base.html" %}
{% block content %}
<div id="readerContext" data-config='{{ ({'viewer': gallery_viewer_config, 'context': reader_context} ) | tojson }}' hidden></div>

<div class="panel">
  <div style="display:flex; align-items:center; gap:1rem;">
    <button id="readerBack" type="button">← Back</button>
    <h2 id="readerTitle">Reader</h2>
  </div>
  <div id="readerWrapper" style="display:flex; align-items:center; justify-content:center; gap:1rem; margin-top:1rem; height:calc(100vh - 160px);">
    <button id="prevBtn" class="navBtn">←</button>
    <div id="readerImgWrap" style="max-width:90vw; width:90vw; display:flex; align-items:center; justify-content:center; flex:1; overflow:auto;">
      <img id="readerImg" src="" alt="page" style="max-width:100%; max-height:100vh; height:auto; object-fit:contain; display:block; margin:0 auto;" />
    </div>
    <button id="nextBtn" class="navBtn">→</button>
  </div>
  <p id="readerCounter" style="margin-top:0.5rem"></p>
</div>

<style>
/* When reader is open, lock page scrolling */
html.reader-open, html.reader-open body { height: 100%; overflow: hidden; }
#readerWrapper { height: 100vh; box-sizing: border-box; }
#readerImgWrap { max-width: 90vw; width: 90vw; display: flex; align-items: center; justify-content: center; flex: 1; overflow: auto; }
#readerImg { max-width: 100%; max-height: calc(100vh - 120px); height: auto; object-fit: contain; display: block; margin: 0 auto; }
</style>

{% endblock %}

{% block scripts %}
<script>
"use strict";
const RAW = JSON.parse(document.getElementById('readerContext').dataset.config || '{}');
const VIEWER_CONFIG = RAW.viewer || {};
const CTX = RAW.context || {};
const GALLERY_ID = Number(CTX.gallery_id || 0);

const reader = {
  pages: [],
  index: 0,
  title: '',
  onClose: null,
};

function showPage() {
  const img = document.getElementById('readerImg');
  const counter = document.getElementById('readerCounter');
  img.src = reader.pages[reader.index] || '';
  counter.textContent = `${reader.index + 1} / ${reader.pages.length}`;
  document.getElementById('prevBtn').disabled = reader.index === 0;
  document.getElementById('nextBtn').disabled = reader.index >= reader.pages.length - 1;
}

function openReader(pages, title, onClose) {
  reader.pages = pages;
  reader.index = 0;
  reader.title = title || '';
  reader.onClose = onClose || null;
  document.getElementById('readerTitle').textContent = reader.title;
  document.getElementById('readerCounter').textContent = '';
  document.documentElement.classList.add('reader-open');
  showPage();
}

function closeReader() {
  document.documentElement.classList.remove('reader-open');
  if (reader.onClose) reader.onClose();
}

document.getElementById('prevBtn').addEventListener('click', () => {
  if (reader.index > 0) { reader.index -= 1; showPage(); }
});
document.getElementById('nextBtn').addEventListener('click', () => {
  if (reader.index < reader.pages.length - 1) { reader.index += 1; showPage(); }
});
document.addEventListener('keydown', e => {
  if (document.getElementById('readerImg').src === '') return;
  if (e.key === 'ArrowLeft' && reader.index > 0) { reader.index--; showPage(); }
  if (e.key === 'ArrowRight' && reader.index < reader.pages.length - 1) { reader.index++; showPage(); }
  if (e.key === 'Escape') closeReader();
});

document.getElementById('readerBack').addEventListener('click', () => {
  if (history.length > 1) { history.back(); return; }
  if (CTX.type === 'creators') {
    window.location.href = `/creators/${encodeURIComponent(CTX.creator || '')}/`;
  } else if (CTX.type === 'collections') {
    window.location.href = `/collections/${encodeURIComponent(CTX.collection_id || '')}/`;
  } else {
    window.location.href = '/';
  }
});

async function loadPages() {
  if (!GALLERY_ID) { document.getElementById('readerTitle').textContent = 'Missing gallery id'; return; }
  try {
    const res = await fetch(`/api/gallery/list_pages_by_id/${encodeURIComponent(GALLERY_ID)}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const root = String(data.root_path || '');
    const pages = (data.pages || []).map(name => {
      const base = `/api/gallery/view_by_id/${encodeURIComponent(GALLERY_ID)}/${encodeURIComponent(name)}`;
      return root ? `${base}?root=${encodeURIComponent(root)}` : base;
    });
    if (!pages.length) throw new Error('Gallery is empty');
    openReader(pages, String(data.title || `Gallery ${GALLERY_ID}`));
  } catch (err) {
    document.getElementById('readerTitle').textContent = `Could not load gallery: ${err.message}`;
  }
}

loadPages();
</script>
{% endblock %}
